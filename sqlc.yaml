# sqlc generates the persistence query layer. The schema is the shipped
# migration history itself (ADR 0038); hand-written annotated SQL lives in
# sqlc/queries and generated Go is committed under gen/sqlc. Regenerate with
# `make sqlc` and never hand-edit the generated files.
#
# sqlc is pinned to v1.31.1 in the Makefile; CI installs the same version and
# asserts `git diff --exit-code` after regeneration.
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/*.up.sql"
    queries: "sqlc/queries"
    gen:
      go:
        package: "sqlc"
        out: "gen/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        overrides:
          # Native Go scalars for non-nullable columns; sqlc keeps nullable
          # columns of these types as pgtype.* (NULL-safe) so no pointer
          # semantics are lost. int8 already defaults to int64; the override
          # documents the intent and pins any expressions that would otherwise
          # drift.
          - db_type: "uuid"
            go_type: "string"
          - db_type: "timestamptz"
            go_type: "time.Time"
          # sqlc matches db_type against the schema DDL spelling; the
          # pg_catalog.* canonical names cover integer/smallint/bigint.
          - db_type: "pg_catalog.int4"
            go_type: "int"
          - db_type: "pg_catalog.int2"
            go_type: "int"
          - db_type: "pg_catalog.int8"
            go_type: "int64"
          # my_books_evidence columns derived through a window-function source
          # projection cannot be statically typed by sqlc; pin the concrete
          # domain-facing Go types they always produce.
          - column: "my_books_evidence.source_id"
            go_type: "string"
          - column: "my_books_evidence.source_owner_id"
            go_type: "string"
          - column: "my_books_evidence.source_content_hash"
            go_type: "string"
          - column: "my_books_evidence.source_content_revision_id"
            go_type: "string"
          - column: "my_books_evidence.source_content_snapshot_id"
            go_type: "string"
          - column: "my_books_evidence.acquired"
            go_type: "bool"
          # source_created_at is passed through the LEFT JOIN without
          # COALESCE, so the column is nullable at runtime even though the
          # base table is NOT NULL; keep pointer semantics.
          - column: "my_books_evidence.source_created_at"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "my_books_evidence.analysis_run_id"
            go_type: "string"
          - column: "my_books_evidence.corpus_id"
            go_type: "string"