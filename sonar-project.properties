# SonarQube Cloud analysis, run by .github/workflows/sonarqube.yml.
# Organisation and project keys come from the setup in issue #1734.
sonar.organization=justin-hayes
sonar.projectKey=justin-hayes_mouseion
sonar.projectName=Mouseion

# Everything in the repository is source. Go _test.go files, the NLP tests, and
# the browser suite are tests.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,nlp/tests/**,e2e/**

# Generated code, vendored static assets, the generated stylesheet, the
# immutable baseline migration (ADR 0038, ADR 0070), and local tooling output
# are not analysed.
#
# EPUB test fixtures deliberately reproduce real-world markup (missing doctypes
# and titles, duplicate ids) so the importer is tested against it; editing them
# would weaken the tests. The recognition-card preview reproduces Anki's
# per-card `<hr id=answer>`, so its duplicate id is intended.
sonar.exclusions=gen/**,**/*_templ.go,internal/webapp/static/vendor/**,internal/webapp/static/app.css,migrations/000001_initialize.up.sql,migrations/000001_initialize.down.sql,**/node_modules/**,.venv/**,.tmp/**,e2e/test-results/**,e2e/playwright-report/**,internal/epub/testdata/**,internal/epub/testfixtures/**,internal/cardexport/testdata/recognition_card_preview.html

# Findings recorded as intended behaviour. Each entry is scoped to one rule and
# one file, so an unrelated finding of the same rule still surfaces. Reviewable
# here rather than dismissed in the SonarQube Cloud UI.
#
# go:S2092 — Secure cookies follow MOUSEION_COOKIE_SECURE. Mouseion is reached
# over plain HTTP on the tailnet by design (ADR 0009); the nolint:gosec notes in
# these files say the same.
# go:S5332 — the http:// strings are OPDS link-relation identifiers, the IDPF
# OPS XML namespace, and the loopback-only health-check URL, not network
# endpoints that could be upgraded.
# godre:S8168 — each flagged transaction in analysis jobs defers its rollback
# through the shared txcleanup helper, which Sonar doesn't recognise.
# pythonsecurity:S8707 — the two NLP scripts are local developer tools whose
# paths come from operator-supplied CLI arguments, not from requests.
# plsql:NullComparison — deck_preparations.error is NOT NULL DEFAULT '' (ADR
# 0070 baseline), so the `<>` comparison in the repreparation query is not a
# NULL comparison.
sonar.issue.ignore.multicriteria=webapp,webauth,mainserver,toc,opdsclient,analysisjobs,derivescript,measurescript,deckprep
sonar.issue.ignore.multicriteria.webapp.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.webapp.resourceKey=internal/webapp/webapp.go
sonar.issue.ignore.multicriteria.webauth.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.webauth.resourceKey=internal/webauth/webauth.go
sonar.issue.ignore.multicriteria.mainserver.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.mainserver.resourceKey=cmd/server/main.go
sonar.issue.ignore.multicriteria.toc.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.toc.resourceKey=internal/epub/toc_projection.go
sonar.issue.ignore.multicriteria.opdsclient.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.opdsclient.resourceKey=internal/opds/client.go
sonar.issue.ignore.multicriteria.analysisjobs.ruleKey=godre:S8168
sonar.issue.ignore.multicriteria.analysisjobs.resourceKey=internal/analysis/jobs.go
sonar.issue.ignore.multicriteria.derivescript.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.derivescript.resourceKey=nlp/scripts/derive_dictionary_index.py
sonar.issue.ignore.multicriteria.measurescript.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.measurescript.resourceKey=nlp/scripts/measure_german_separable_verbs.py
sonar.issue.ignore.multicriteria.deckprep.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.deckprep.resourceKey=sqlc/queries/deck_preparations.sql

# Go unit and integration coverage, written by `make coverage`. SonarQube Cloud
# merges the two profiles.
sonar.go.coverage.reportPaths=.tmp/coverage/go-unit.out,.tmp/coverage/go-integration.out

# NLP service coverage (Cobertura XML), written by `make coverage`. Its paths are
# relative to the repository root.
sonar.python.coverage.reportPaths=.tmp/coverage/python.xml

# Linter findings, written by the "Lint reports for SonarQube Cloud" step in
# .github/workflows/sonarqube.yml. These are imported only; .golangci.yml, the
# Ruff configuration and the lint jobs in ci.yml remain the enforcement.
sonar.go.golangci-lint.reportPaths=.tmp/lint/golangci-lint-report.xml
sonar.python.ruff.reportPaths=.tmp/lint/ruff-report.json
