# SonarQube Cloud analysis, run by .github/workflows/sonarqube.yml.
# Organisation and project keys come from the setup in issue #1734.
sonar.organization=justin-hayes
sonar.projectKey=justin-hayes_mouseion
sonar.projectName=Mouseion

# Everything in the repository is source. Go _test.go files, the NLP tests, and
# the browser suite are tests.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,nlp/tests/**,e2e/**

# Generated code, vendored static assets, the generated stylesheet, the
# immutable baseline migration (ADR 0038, ADR 0070), and local tooling output
# are not analysed.
#
# The EPUB fixture trees and the card-export preview deliberately reproduce
# real-world markup (missing doctype, lang and title; Anki's per-card
# <hr id=answer>). Editing them would weaken the tests, so they are not analysed.
# Only the named files are excluded: authored code in the same packages is still
# analysed.
sonar.exclusions=gen/**,**/*_templ.go,internal/webapp/static/vendor/**,internal/webapp/static/app.css,migrations/000001_initialize.up.sql,migrations/000001_initialize.down.sql,**/node_modules/**,.venv/**,.tmp/**,e2e/test-results/**,e2e/playwright-report/**,internal/epub/testdata/**,internal/epub/testfixtures/**,internal/cardexport/testdata/recognition_card_preview.html

# Go unit and integration coverage, written by `make coverage`. SonarQube Cloud
# merges the two profiles.
sonar.go.coverage.reportPaths=.tmp/coverage/go-unit.out,.tmp/coverage/go-integration.out

# NLP service coverage (Cobertura XML), written by `make coverage`. Its paths are
# relative to the repository root.
sonar.python.coverage.reportPaths=.tmp/coverage/python.xml

# Linter findings, written by the "Lint reports for SonarQube Cloud" step in
# .github/workflows/sonarqube.yml. These are imported only; .golangci.yml, the
# Ruff configuration and the lint jobs in ci.yml remain the enforcement.
sonar.go.golangci-lint.reportPaths=.tmp/lint/golangci-lint-report.xml
sonar.python.ruff.reportPaths=.tmp/lint/ruff-report.json

# Intended behaviour, recorded as issue-ignore criteria. Each entry is scoped to
# one rule and one file, so unrelated findings on the same rule stay visible.
# Review or change these here, not in the SonarQube Cloud UI.
sonar.issue.ignore.multicriteria=cookieSecure,opdsHttp,epubOpsHttp,healthCheckHttp,txRollback,repreparationNullCompare,pathMeasureInput,pathMeasureOutput,pathIndexInput,pathIndexOutput

# go:S2092: the Secure flag follows MOUSEION_COOKIE_SECURE. Plain HTTP on the
# tailnet is the design (ADR 0009); webauth.NewCookie carries the matching nolint:gosec note.
sonar.issue.ignore.multicriteria.cookieSecure.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.cookieSecure.resourceKey=internal/webauth/cookie.go

# go:S5332: these http:// strings are the OPDS link-relation identifiers, the
# IDPF OPS XML namespace, and the loopback-only health-check URL. None is a
# network endpoint that could be upgraded to https.
sonar.issue.ignore.multicriteria.opdsHttp.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.opdsHttp.resourceKey=internal/opds/client.go
sonar.issue.ignore.multicriteria.epubOpsHttp.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.epubOpsHttp.resourceKey=internal/epub/toc_projection.go
sonar.issue.ignore.multicriteria.healthCheckHttp.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.healthCheckHttp.resourceKey=cmd/server/main.go

# godre:S8168: every flagged transaction in the analysis jobs already defers a
# rollback through the shared txcleanup helper, which Sonar does not recognise.
sonar.issue.ignore.multicriteria.txRollback.ruleKey=godre:S8168
sonar.issue.ignore.multicriteria.txRollback.resourceKey=internal/analysis/jobs.go

# plsql:NullComparison: the deck-preparation error column is NOT NULL DEFAULT ''
# (migrations/000001_initialize.up.sql), so `p.error <> ...` is a correct
# comparison, not a NULL comparison.
sonar.issue.ignore.multicriteria.repreparationNullCompare.ruleKey=plsql:NullComparison
sonar.issue.ignore.multicriteria.repreparationNullCompare.resourceKey=sqlc/queries/deck_preparations.sql

# pythonsecurity:S8707: the input and output paths of these local developer
# scripts are operator-supplied CLI arguments (--input, --output), read and written
# on the operator's own machine. Nothing here takes a path from a network request
# or an untrusted file, so there is no traversal boundary to enforce. The
# measurement run takes its paths from the script's arguments, so Sonar reports
# its read and write in the module it lives in.
sonar.issue.ignore.multicriteria.pathMeasureInput.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pathMeasureInput.resourceKey=nlp/src/mouseion_nlp/separable_measurement.py
sonar.issue.ignore.multicriteria.pathMeasureOutput.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pathMeasureOutput.resourceKey=nlp/src/mouseion_nlp/separable_measurement.py
sonar.issue.ignore.multicriteria.pathIndexInput.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pathIndexInput.resourceKey=nlp/scripts/derive_dictionary_index.py
sonar.issue.ignore.multicriteria.pathIndexOutput.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.pathIndexOutput.resourceKey=nlp/scripts/derive_dictionary_index.py
