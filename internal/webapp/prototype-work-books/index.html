<!doctype html>
<!--
  PROTOTYPE — throwaway, not for main. Issue #2323 (map #2292).
  Question: how does My Books present a work's grouped Books (one per constituent
  book) as one work row? Identity and bucket summary, listing the books and moving
  them to To Read without 24 equal buttons, what All / Inbox / To Read / Read count
  and filter, how search matches, how Hide works, and compact reflow.
  Four variants of Ancient Greek My Books, switchable via ?variant=A|B|C|D:
    A  Disclosure + selection — variant D of #2298 refined: books in a table inside a
       disclosure, checkboxes and "Move selected to To Read"; counts Books
    B  Chosen books as rows   — Books with intent or history are nested rows; Inbox books
       fold into one line with a "Move Book [n] to To Read" picker; counts Books
    C  Work page              — the list has one entry per work; its Books live on a
       My Books work page with a range move; counts works (entries)
    D  Numbered strip         — one numbered cell per book; choosing a cell opens that
       Book's own line beneath; counts Books
  Uses the app's real /static/app.css. Data is illustrative; every mutation is in memory.
  Run: python3 -m http.server -d internal/webapp 8124
       open http://127.0.0.1:8124/prototype-work-books/?variant=A
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/static/app.css">
<style>
  /* Prototype-only layout. Uses the app's tokens; nothing here is a pattern yet. */
  .proto-note { font-size: var(--mouseion-font-size-metadata, 13px); color: var(--mouseion-color-text-muted); border-left: 3px solid var(--mouseion-color-warning); padding: .25rem .6rem; margin: .5rem 0 1rem; }
  .wb-small { font-size: var(--mouseion-font-size-metadata, 13px); color: var(--mouseion-color-text-muted); }
  .wb-meta { display: block; font-size: var(--mouseion-font-size-metadata, 13px); color: var(--mouseion-color-text-muted); }
  .wb-group { grid-column: 2 / -1; min-width: 0; margin-top: var(--mouseion-space-3, .75rem); }
  .wb-group > details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 550; }
  .wb-table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  .wb-table th, .wb-table td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--mouseion-color-border); vertical-align: top; }

  .wb-table td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wb-table label { display: flex; align-items: center; min-height: 32px; gap: .4rem; margin: 0; }
  .wb-table tr.is-hidden { opacity: .6; }
  .wb-bulk { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .6rem; align-items: center; }
  .wb-nested { list-style: none; margin: .5rem 0 0; padding: 0 0 0 1rem; border-left: 2px solid var(--mouseion-color-surface-quiet); }
  .wb-nested > li { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) minmax(10rem, 16rem); gap: .25rem 1rem; padding: .6rem 0; border-bottom: 1px solid var(--mouseion-color-border); }
  .wb-nested .wb-num { display: grid; place-items: center; width: 2.25rem; height: 3rem; background: var(--mouseion-color-surface-quiet); font-family: var(--mouseion-font-reading); font-size: 1.1rem; }
  .wb-nested .wb-margin { border-left: 2px solid var(--mouseion-color-surface-quiet); padding-left: .75rem; font-size: var(--mouseion-font-size-metadata, 13px); color: var(--mouseion-color-text-muted); display: grid; gap: .3rem; align-content: start; }
  .wb-nested .wb-acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: .5rem; align-items: start; }
  .wb-fold { padding: .6rem 0; display: grid; gap: .4rem; }

  .wb-fold select, .wb-range select { width: auto; min-width: 4.5rem; margin: 0; }
  .wb-range { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: 1rem 0; padding: .75rem 0; border-block: 1px solid var(--mouseion-color-border); }
  .wb-range label { margin: 0; display: flex; gap: .4rem; align-items: center; }
  .wb-strip { display: flex; flex-wrap: wrap; gap: .3rem; list-style: none; padding: 0; margin: .25rem 0 .35rem; }
  .wb-strip a { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border: 1px dashed var(--mouseion-color-control-border, #999); border-radius: 3px; text-decoration: none; color: var(--mouseion-color-text); font-variant-numeric: tabular-nums; font-size: .9rem; position: relative; }
  .wb-strip a.c-toread { border: 2px solid var(--mouseion-color-text); font-weight: 650; }
  .wb-strip a.c-current { border: 2px solid var(--mouseion-color-accent); background: var(--mouseion-color-accent); color: var(--mouseion-color-surface, #fff); font-weight: 700; }
  .wb-strip a.c-read { border: 1px solid transparent; background: var(--mouseion-color-surface-quiet); color: var(--mouseion-color-text-muted); }
  .wb-strip a.c-hidden { opacity: .45; text-decoration: line-through; }
  .wb-strip a.c-problem::after { content: "!"; position: absolute; top: -.45rem; right: -.35rem; font-size: .7rem; font-weight: 800; background: var(--mouseion-color-warning); color: #000; border-radius: 999px; width: .95rem; height: .95rem; display: grid; place-items: center; }
  .wb-strip a[aria-current] { outline: 3px solid var(--mouseion-color-focus, #36c); outline-offset: 2px; }
  .wb-legend { font-size: 12px; color: var(--mouseion-color-text-muted); }
  .wb-detail .library-book__recovery { width: auto; }
  .wb-detail { margin-top: .5rem; padding: .6rem .75rem; background: var(--mouseion-color-surface-quiet); display: grid; gap: .4rem; }
  .wb-detail .wb-acts { display: flex; flex-wrap: wrap; gap: .5rem; align-items: start; }
  .wb-inline { display: flex; flex-wrap: wrap; gap: .5rem; align-items: start; }
  .wb-entries { margin: -.25rem 0 .75rem; }
  .btn-link { padding: 0; border: 0; background: none; color: var(--mouseion-color-accent); text-decoration: underline; cursor: pointer; font: inherit; }
  @media (max-width: 40rem) {
    .wb-group { grid-column: 1 / -1; }
    .wb-nested { padding-left: .5rem; }
    .wb-nested > li { grid-template-columns: 2.5rem minmax(0, 1fr); }
    .wb-nested .wb-margin { grid-column: 2; border-left: 0; padding-left: 0; }
    .wb-table .col-passage, .wb-table .col-words { display: none; }
  }

  /* Prototype chrome: deliberately not part of the design. */
  #proto-bar { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; align-items: center; gap: .5rem; background: #111; color: #fff; border-radius: 999px; padding: .35rem .5rem; box-shadow: 0 6px 24px rgba(0,0,0,.35); font: 600 14px/1.2 system-ui, sans-serif; }
  #proto-bar button { background: #333; color: #fff; border: 0; border-radius: 999px; min-width: 2.2rem; height: 2.2rem; cursor: pointer; font: inherit; }
  #proto-bar button:hover { background: #555; }
  #proto-bar .label { padding: 0 .6rem; white-space: nowrap; }
  #proto-panel { position: fixed; right: 1rem; bottom: 1rem; z-index: 1000; width: 21rem; max-height: 70vh; overflow: auto; background: #111; color: #eee; border-radius: 10px; padding: .6rem .8rem; font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  #proto-panel summary { cursor: pointer; font-weight: 600; }
  #proto-panel label { display: block; margin: .3rem 0; color: #eee; }
  #proto-panel button { font: inherit; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; padding: .2rem .5rem; margin: .2rem .2rem 0 0; cursor: pointer; }
  #proto-panel pre { white-space: pre-wrap; background: #000; padding: .4rem; border-radius: 6px; font-size: 11px; max-height: 18rem; overflow: auto; }
  #proto-frame { display: block; margin: 1rem auto 5rem; width: 390px; height: calc(100vh - 7rem); border: 1px solid #888; box-shadow: 0 6px 24px rgba(0,0,0,.25); background: #fff; }
  body.embed #proto-bar, body.embed #proto-panel { display: none; }
</style>
</head>
<body class="my-books-shell">
<div id="app"></div>
<div id="proto-bar" role="toolbar" aria-label="Prototype variant switcher">
  <button type="button" id="proto-prev" aria-label="Previous variant">←</button>
  <span class="label" id="proto-label"></span>
  <button type="button" id="proto-next" aria-label="Next variant">→</button>
</div>
<details id="proto-panel">
  <summary>Prototype scenario &amp; state</summary>
  <label><input type="checkbox" id="sc-compact"> Compact width (390px frame)</label>
  <button type="button" id="sc-fresh">Odyssey just added (all Inbox)</button>
  <button type="button" id="sc-reset">Mid-way library without the Odyssey</button>
  <p>Try: filter <em>To Read</em>, search <code>iliad 6</code>, <code>homer</code>, <code>Ἰλιάς</code>, <code>6</code>; Show hidden; hide a whole work.</p>
  <pre id="sc-state"></pre>
</details>

<script>
(function () {
'use strict';

// ---------- Illustrative data ----------
var ILIAD = [611,877,461,544,909,529,482,565,713,579,848,471,837,522,746,867,761,617,424,503,611,515,897,804];
var ODYSSEY = [444,434,497,847,493,331,347,586,566,574,640,453,440,533,557,481,606,428,604,394,434,501,372,548];
var WORKS = {
  iliad: { key: 'iliad', title: 'Iliad', greek: 'Ἰλιάς', author: 'Homer', books: ILIAD.map(function (l, i) { return { range: (i+1) + '.1–' + (i+1) + '.' + l, words: Math.round(l * 6.9 / 10) * 10 }; }) },
  odyssey: { key: 'odyssey', title: 'Odyssey', greek: 'Ὀδύσσεια', author: 'Homer', books: ODYSSEY.map(function (l, i) { return { range: (i+1) + '.1–' + (i+1) + '.' + l, words: Math.round(l * 6.8 / 10) * 10 }; }) },
  anabasis: { key: 'anabasis', title: 'Anabasis', greek: 'Κύρου Ἀνάβασις', author: 'Xenophon', books: [10500,8000,8800,10900,9100,7300,11300].map(function (w, i) { return { range: (i+1) + '.1.1–' + (i+1) + '.' + [10,6,5,8,8,6,8][i] + '.end', words: w }; }) },
  histories: { key: 'histories', title: 'Histories', greek: 'Ἱστορίαι', author: 'Herodotus', books: [33100,24800,22300,25100,17900,19700,32800,20800,18600].map(function (w, i) { return { range: (i+1) + '.1–' + (i+1) + '.' + [216,182,160,205,126,140,239,144,122][i], words: w }; }) },
  apology: { key: 'apology', title: 'Apology', greek: 'Ἀπολογία Σωκράτους', author: 'Plato', whole: true, books: [{ range: '17a–42a', words: 8900 }] }
};
var WORK_ORDER = ['iliad', 'anabasis', 'apology', 'histories', 'odyssey'];

function mk(work, n, o) { return Object.assign({ id: work + '-' + n, work: work, n: n, disp: 'Inbox', current: false, read: null, hidden: false, prep: null, cov: null }, o || {}); }
function seed(fresh) {
  var B = [], E = variant() === 'E';
  WORKS.iliad.books.forEach(function (_, i) {
    var n = i + 1, o = {};
    if (n === 1) o = { read: '2026-09-14', prep: 'done', cov: 88 };
    if (n === 2) o = { disp: 'To Read', current: true, prep: 'done', cov: 79 };
    if (n === 3) o = { disp: 'To Read', prep: 'done', cov: 74 };
    if (n === 4) o = { disp: 'To Read', prep: 'fetching' };
    if (n === 6) o = { disp: 'To Read', prep: 'unavailable' };
    if (n === 9) o = { hidden: true };
    // Variant E: the Iliad was moved to To Read as a work, so every unread book is To Read.
    if (E && n > 2) o = { disp: 'To Read', prep: n === 4 || n >= 21 ? 'fetching' : n === 6 ? 'unavailable' : 'done', cov: 55 + (n * 7) % 30 };
    B.push(mk('iliad', n, o));
  });
  WORKS.anabasis.books.forEach(function (_, i) { var n = i + 1; B.push(mk('anabasis', n, n === 1 ? { read: '2026-06-02', prep: 'done', cov: 91 } : n === 2 || E ? { disp: 'To Read', prep: 'done', cov: 70 + (n * 3) % 20 } : {})); });
  B.push(mk('apology', 1));
  B.push(mk('histories', 1));
  if (fresh) WORKS.odyssey.books.forEach(function (_, i) { B.push(mk('odyssey', i + 1)); });
  if (E) B.filter(function (b) { return b.prep === 'fetching'; }).forEach(function (b, i) { setTimeout(function () { prepare(b, true); }, i * 1800); });
  return B;
}
var S = { books: [], flash: null };

// ---------- URL state ----------
var VARIANTS = [['A', 'Disclosure + selection'], ['B', 'Chosen books as rows'], ['C', 'Work page'], ['D', 'Numbered strip'], ['E', 'Strip, work-level To Read']];
S.books = seed(true);
function P() { return new URLSearchParams(location.search); }
function variant() { var v = P().get('variant'); return VARIANTS.some(function (x) { return x[0] === v; }) ? v : 'A'; }
function href(over) { var p = P(); Object.keys(over).forEach(function (k) { if (over[k] == null || over[k] === '') p.delete(k); else p.set(k, over[k]); }); return '?' + p.toString(); }
function go(over, replace) { history[replace ? 'replaceState' : 'pushState'](null, '', href(over)); render(); }
window.addEventListener('popstate', render);
function link(over, text, attrs) { return '<a href="' + esc(href(over)) + '" data-go="' + esc(JSON.stringify(over)) + '"' + (attrs || '') + '>' + text + '</a>'; }

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function badge(label, tone, shape) { return '<span class="status-badge status-badge--' + tone + '"><span class="status-badge__shape status-badge__shape--' + shape + '" aria-hidden="true"></span>' + esc(label) + '</span>'; }
function btn(act, arg, label, cls) { return '<button type="button" class="' + (cls || 'btn btn-outline') + '" data-act="' + act + '" data-arg="' + esc(arg || '') + '">' + label + '</button>'; }
function fmt(n) { return n.toLocaleString('en'); }
function norm(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

// ---------- Book model ----------
function bucket(b) { return b.current ? 'current' : b.disp === 'To Read' ? 'toread' : b.read ? 'read' : 'inbox'; }
var BUCKET_LABEL = { current: 'Currently reading', toread: 'To Read', read: 'Read', inbox: 'Inbox' };
function bucketBadge(b) { var k = bucket(b); return k === 'current' ? badge('Currently reading', 'info', 'dot') : k === 'read' ? badge('Read', 'neutral', 'ring') : badge(BUCKET_LABEL[k], 'neutral', 'ring'); }
function inFilter(b, f) { var k = bucket(b); return !f || f === 'all' ? true : f === 'toread' ? (k === 'toread' || k === 'current') : k === f; }
function W(b) { return WORKS[b.work]; }
function unit(b) { return W(b).books[b.n - 1]; }
function workBooksInLibrary(wk) { return S.books.filter(function (b) { return b.work === wk; }); }
function grouped(wk) { return workBooksInLibrary(wk).length > 1; }
function bookName(b) { return W(b).whole ? W(b).title : W(b).title + ', Book ' + b.n; }
function problem(b) { return b.prep === 'unavailable' || b.prep === 'failed' || b.prep === 'mismatch'; }
function note(b) {
  switch (b.prep) {
    case 'fetching': return 'Analysis incomplete. Fetching the reviewed source…';
    case 'unavailable': return 'Assessment unavailable. The source could not be fetched.';
    case 'failed': return 'Analysis failed.';
    case 'done': return b.cov != null && bucket(b) !== 'inbox' ? 'Known coverage ' + b.cov + '%' + (bucket(b) === 'read' ? '' : ' · ' + pts(b.cov < 80 ? 80 - b.cov : 90 - b.cov) + ' to the next band') : '';
    default: return '';
  }
}
function pts(n) { return n + (n === 1 ? ' point' : ' points'); }
function recovery(b) { return b.prep === 'unavailable' ? btn('retry', b.id, 'Retry acquisition', 'library-book__recovery') : b.prep === 'failed' ? btn('retry', b.id, 'Retry analysis', 'library-book__recovery') : ''; }
function ranges(ns) { var out = [], i = 0; while (i < ns.length) { var j = i; while (j + 1 < ns.length && ns[j + 1] === ns[j] + 1) j++; out.push(j - i >= 2 ? ns[i] + '–' + ns[j] : j > i ? ns[i] + ', ' + ns[j] : String(ns[i])); i = j + 1; } return out.join(', '); }

// ---------- Search (shared by every variant) ----------
// Query text matches author, English title or Greek title (accent-insensitive). A trailing
// number (optionally "book 6") narrows to that constituent book.
function parseQuery() {
  var q = (P().get('q') || '').trim(); if (!q) return null;
  var m = q.match(/^(.*?)(?:\s*,?\s*(?:book|bk\.?)?\s*(\d{1,2}))?$/i);
  return { text: norm((m[1] || '').trim()), n: m[2] ? +m[2] : null, raw: q };
}
function matchesQuery(b, pq) {
  if (!pq) return true;
  var w = W(b), hay = norm(w.author + ' ' + w.title + ' ' + w.greek);
  if (pq.text && hay.indexOf(pq.text) < 0) return false;
  if (pq.n != null && !w.whole && b.n !== pq.n) return false;
  if (pq.n != null && w.whole && !pq.text) return false;
  return true;
}

// The set of Books the list shows, after hidden, search and bucket filter.
function showHidden() { return P().get('hidden') === '1'; }
function filt() { return P().get('f') || 'all'; }
function scoped() { var pq = parseQuery(), sh = showHidden(); return S.books.filter(function (b) { return (sh || !b.hidden) && matchesQuery(b, pq); }); }
function shown() { var f = filt(); return scoped().filter(function (b) { return inFilter(b, f); }); }
function hiddenOmitted() { if (showHidden()) return 0; var pq = parseQuery(), f = filt(); return S.books.filter(function (b) { return b.hidden && matchesQuery(b, pq) && inFilter(b, f); }).length; }
function byWork(list) { var g = {}; list.forEach(function (b) { (g[b.work] = g[b.work] || []).push(b); }); return WORK_ORDER.filter(function (k) { return g[k]; }).map(function (k) { return { work: WORKS[k], books: g[k] }; }); }

// ---------- Actions ----------
function prepare(b) { if (b.prep === 'done') return; b.prep = 'fetching'; setTimeout(function () { if (b.prep === 'fetching') { b.prep = 'done'; b.cov = 60 + Math.round(Math.random() * 25); render(); } }, 2500); }
function toRead(ids) { var bs = ids.map(byId).filter(function (b) { return b && b.disp !== 'To Read'; }); bs.forEach(function (b) { b.disp = 'To Read'; prepare(b); }); if (bs.length) flash('Moved to To Read', namesOf(bs) + '. Sources are being fetched and analysed.'); }
function toInbox(ids) { var bs = ids.map(byId).filter(function (b) { return b && b.disp === 'To Read' && !b.current; }); bs.forEach(function (b) { b.disp = 'Inbox'; }); if (bs.length) flash('Moved to Inbox', namesOf(bs) + '.'); }
function setHidden(ids, h) { var bs = ids.map(byId).filter(function (b) { return b && b.hidden !== h; }); bs.forEach(function (b) { b.hidden = h; }); if (bs.length) flash(h ? 'Hidden' : 'Unhidden', namesOf(bs) + (h ? '. Reading history, Known vocabulary and analysis are unchanged. Recover with Show hidden books → Unhide.' : '.')); }
function byId(id) { return S.books.find(function (b) { return b.id === id; }); }
function namesOf(bs) { var g = byWork(bs); return g.map(function (x) { return x.work.whole ? x.work.title : x.work.title + (x.books.length === 1 ? ', Book ' : ', Books ') + ranges(x.books.map(function (b) { return b.n; })); }).join('; '); }
function flash(title, text) { S.flash = { title: title, text: text }; }
function idsOfWork(wk, pred) { return workBooksInLibrary(wk).filter(pred || function () { return true; }).map(function (b) { return b.id; }); }

document.addEventListener('click', function (e) {
  var a = e.target.closest('a[data-go]');
  if (a) { e.preventDefault(); go(JSON.parse(a.getAttribute('data-go'))); return; }
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.getAttribute('data-act'), arg = t.getAttribute('data-arg');
  var form = t.closest('form');
  var checked = form ? Array.prototype.map.call(form.querySelectorAll('input[name=book]:checked'), function (i) { return i.value; }) : [];
  switch (act) {
    case 'toread': toRead([arg]); break;
    case 'inbox': toInbox([arg]); break;
    case 'hide': setHidden([arg], true); break;
    case 'unhide': setHidden([arg], false); break;
    case 'retry': prepare(byId(arg)); flash('Retrying', bookName(byId(arg)) + ': fetching the reviewed source again.'); break;
    case 'hide-work': setHidden(idsOfWork(arg), true); break;
    case 'unhide-work': setHidden(idsOfWork(arg), false); break;
    case 'sel-toread': if (!checked.length) return; toRead(checked); break;
    case 'sel-inbox': if (!checked.length) return; toInbox(checked); break;
    case 'sel-hide': if (!checked.length) return; setHidden(checked, true); break;
    case 'sel-unhide': if (!checked.length) return; setHidden(checked, false); break;
    case 'pick-toread': toRead([form.querySelector('select').value]); break;
    case 'range-toread': {
      var lo = +form.querySelector('[name=from]').value, hi = +form.querySelector('[name=to]').value;
      if (lo > hi) { var x = lo; lo = hi; hi = x; }
      toRead(idsOfWork(arg, function (b) { return b.n >= lo && b.n <= hi && bucket(b) === 'inbox' && !b.hidden; })); break;
    }
    case 'work-toread': toRead(idsOfWork(arg, function (b) { return b.disp === 'Inbox' && !b.read; })); break;
    case 'work-inbox': toInbox(idsOfWork(arg)); break;
    case 'start': { var nb = byId(arg), was = S.books.find(function (b) { return b.current; }); S.books.forEach(function (b) { b.current = false; }); nb.current = true; flash('Now reading', bookName(nb) + (was ? '. ' + bookName(was) + ' stays To Read.' : '.')); break; }
    case 'finish': { var fb = byId(arg); fb.current = false; fb.read = '2026-11-09'; fb.disp = 'Inbox'; flash('Finished', bookName(fb) + '. It shows as Read; choose your next reading below.'); break; }
    case 'dismiss': S.flash = null; break;
    default: return;
  }
  render();
});
document.addEventListener('submit', function (e) {
  if (e.target.id === 'lib-search') { e.preventDefault(); S.flash = null; go({ q: e.target.querySelector('input').value, sel: null }); }
  else e.preventDefault();
});

// ---------- Shell ----------
function shell(main) {
  var onReading = P().get('view') === 'reading';
  var nav = [['My Books', !onReading, { view: null, sel: null }], ['Reading', onReading, { view: 'reading', sel: null, f: null, q: null }], ['Vocabulary'], ['Catalogs']].map(function (n) {
    var cls = ' class="site-nav__link' + (n[1] ? ' site-nav__link--current" aria-current="page"' : '"');

  var rows = byWork(cands).map(function (g) {
    var w = g.work;
    if (!grouped(w.key)) { var b = g.books[0]; return '<li class="library-book"><div class="library-book__identity-link">' + cover(w) + '<div class="library-book__text"><h3 class="bibliographic-title">' + esc(bookName(b)) + '</h3><span class="library-book__author">By ' + esc(w.author) + '</span></div></div><div class="library-book__notes">' + E_candNote(b) + '</div><div class="library-book__actions">' + E_candAct(b, cur) + '</div></li>'; }
    var all = workBooksInLibrary(w.key).filter(function (b) { return !b.hidden; });
    var cells = all.map(function (b) {
      var k = bucket(b), cand = k === 'toread', ready = cand && b.prep === 'done';
      var cls = k === 'current' ? 'c-current' : k === 'read' ? 'c-read' : k === 'inbox' ? 'c-inbox' : ready ? 'c-toread' : 'c-inbox' + (problem(b) ? ' c-problem' : '');
      var label = 'Book ' + b.n + ', ' + (k === 'current' ? 'current reading' : k === 'read' ? 'read' : k === 'inbox' ? 'Inbox, not a candidate' : ready ? 'ready, Known coverage ' + b.cov + '%' : note(b));
      return '<li>' + link({ sel: sel === b.id ? null : b.id }, String(b.n), ' class="' + cls + '" aria-label="' + esc(label) + '"' + (sel === b.id ? ' aria-current="true"' : '')) + '</li>';
    }).join('');
    var chosen = all.find(function (b) { return b.id === sel; });
    var detail = chosen ? '<div class="wb-detail"><div><strong>' + esc(bookName(chosen)) + '</strong><span class="wb-meta">Book ' + chosen.n + ' of ' + w.books.length + ' · ' + esc(unit(chosen).range) + ' · ~' + fmt(unit(chosen).words) + ' words</span></div><div>' + E_candNote(chosen) + '</div><div class="wb-acts">' + E_candAct(chosen, cur) + '</div></div>' : '<p class="wb-small">Choose a book number to see its coverage and read it.</p>';
    var ready = g.books.filter(function (b) { return b.prep === 'done'; }).length;
    return '<li class="library-book"><div class="library-book__identity-link">' + cover(w) + '<div class="library-book__text"><h3 class="bibliographic-title">' + esc(w.title) + '</h3><span class="library-book__author">By ' + esc(w.author) + '</span></div></div>' +
      '<div class="library-book__notes"><p>' + ready + ' of ' + g.books.length + ' To Read books ready' + (g.books.length > ready ? '; the rest are preparing or need attention' : '') + '</p></div>' +
      '<div class="wb-group"><ul class="wb-strip" aria-label="Books of ' + esc(w.title) + '">' + cells + '</ul><p class="wb-legend">Bold edge: ready to read · Dashed: preparing or not a candidate · Grey: Read · Filled blue: current · ! needs attention</p>' + detail + '</div></li>';
  }).join('');
  return html + '<section><h2>To Read</h2>' + (rows ? '<ul class="library-books" role="list">' + rows + '</ul>' : '<p>No To Read books.</p>') + '</section>';
}
function E_candNote(b) {
  var k = bucket(b);
  if (k === 'current') return badge('Currently reading', 'info', 'dot');
  if (k === 'read') return 'Read ' + b.read + '. Not a candidate.';
  if (k === 'inbox') return 'In Inbox. Not a candidate.';
  if (b.prep === 'done') return 'Known coverage ' + b.cov + '%';
  return esc(note(b)) + (recovery(b) ? ' ' + recovery(b) : '');
}
function E_candAct(b, cur) { return bucket(b) === 'toread' && b.prep === 'done' ? btn('start', b.id, cur ? 'Switch current reading' : 'Start reading', 'btn btn-outline') : ''; }

// ---------- Page ----------
var NOTES = {
  A: 'Variant A: the books sit in a table inside a “Books” disclosure, closed by default and opened when a filter or search narrows the work. Checkboxes and one set of “With selected” buttons replace 24 Move buttons; the current Book cannot be selected. Counts are Books. The margin keeps whole-work summary and any problem with its recovery action, so a closed disclosure hides nothing that needs attention.',
  B: 'Variant B: Books you have chosen (current, To Read, Read) are nested rows with their own margin and actions; untouched Inbox books fold into one line with a “Move Book [n] to To Read” picker. Counts are Books. Filtering To Read shows the work with only its chosen rows.',
  C: 'Variant C: the list has one entry per work, and the tabs count entries (a work appears under every tab one of its books belongs to). The books live on a My Books work page with a table and a “move a range to To Read” form. Search for “iliad 6” keeps the work entry and names Book 6 in it.',
  E: 'Variant E: D’s strip with a work-level rule. A grouped work moves to To Read (and back to Inbox) as a whole, so the strip only shows state and opens a Book; there are no per-book Move or Hide actions. Read books are skipped by the move, and the current Book stays To Read. Interleaving happens on Reading (top bar), where you choose any ready book as the current reading. Want only Book 6? Add just that book from the Classical catalog. Counts are Books.',
  D: 'Variant D: one numbered cell per book, shaped by bucket (not colour alone; each cell has a full label). Choosing a cell opens that Book’s own line, with the same actions an ordinary row has. Counts are Books; filters and search drop non-matching cells.'
};
function library() {
  var v = variant(), groups = byWork(shown());
  var rows = groups.map(function (g) { return grouped(g.work.key) ? ({ A: A_row, B: B_row, C: C_row, D: D_row, E: function (x) { return D_row(x, true); } })[v](g) : singleRow(g.books[0]); }).join('');
  return '<section class="library-masthead"><h1>My Books</h1><p class="library-language-context">Ancient Greek collection</p></section>' +
    '<p class="proto-note">' + NOTES[v] + ' Search (all variants) matches author, English or Greek title, accent-insensitively; a trailing number narrows to that book (“iliad 6”). A work with only one Book in My Books stays an ordinary row, titled “Histories, Book 1” with “Book 1 of 9”.</p>' +
    finder() + flashHTML() + (rows ? list(rows) : '<article class="empty-state"><h2>No books match</h2><p>' + link({ q: null, f: null }, 'Clear search and filters') + '</p></article>');
}
function render() {
  var p = P();
  document.body.classList.toggle('embed', p.get('embed') === '1');
  if (p.get('compact') === '1' && p.get('embed') !== '1') {
    var src = new URLSearchParams(p); src.delete('compact'); src.set('embed', '1');
    var want = '?' + src.toString(), fr = document.getElementById('proto-frame');
    if (!fr) document.getElementById('app').innerHTML = '<iframe id="proto-frame" title="Compact width preview" src="' + esc(want) + '"></iframe>';
    else if (fr.getAttribute('src') !== want) fr.setAttribute('src', want);
  } else {
    var main = p.get('view') === 'work' && variant() === 'C' && WORKS[p.get('work')] ? C_workPage(WORKS[p.get('work')]) : p.get('view') === 'reading' && variant() === 'E' ? E_reading() : library();
    document.getElementById('app').innerHTML = shell(main);
  }
  var lab = VARIANTS.find(function (x) { return x[0] === variant(); });
  document.getElementById('proto-label').textContent = lab[0] + ' (' + lab[1] + ')';
  document.getElementById('sc-compact').checked = p.get('compact') === '1';
  var summary = {}; S.books.forEach(function (b) { var k = b.work; (summary[k] = summary[k] || []).push(b.n + ':' + bucket(b) + (b.hidden ? '/hidden' : '') + (b.prep && b.prep !== 'done' ? '/' + b.prep : '')); });
  document.getElementById('sc-state').textContent = JSON.stringify({ variant: variant(), filter: filt(), q: p.get('q'), showHidden: showHidden(), books: summary }, null, 1);
}

// ---------- Switcher and scenario panel ----------
function cycle(d) {
  var i = VARIANTS.findIndex(function (x) { return x[0] === variant(); });
  var next = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0];
  var crossesE = (next === 'E') !== (variant() === 'E');
  history.replaceState(null, '', href({ variant: next, view: null, work: null, sel: null }));
  if (crossesE) { S.books = seed(true); S.flash = null; }
  render();
}
document.getElementById('proto-prev').onclick = function () { cycle(-1); };
document.getElementById('proto-next').onclick = function () { cycle(1); };
document.addEventListener('keydown', function (e) {
  var t = e.target; if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); else if (e.key === 'ArrowRight') cycle(1);
});
document.getElementById('sc-compact').onchange = function (e) { go({ compact: e.target.checked ? '1' : null }, true); };
document.getElementById('sc-reset').onclick = function () { S.books = seed(false); S.flash = null; render(); };
document.getElementById('sc-fresh').onclick = function () { S.books = seed(true); S.flash = { title: 'Added to My Books', text: 'Odyssey (24 books) is in your Ancient Greek Inbox. Move a book to To Read when you want to read it; nothing is downloaded before that.' }; go({ f: null, q: null, sel: null }); };
render();
})();
</script>
</body>
</html>
