<!doctype html>
<!-- PROTOTYPE (throwaway, #1480): three design directions, switchable via ?variant=A|B|C. See README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouseion prototype</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root {
  --ground: #F3F6F7; --leaf: #FCFDFB; --quiet: #E3EBF0; --ink: #17232D; --pencil: #586873;
  --blue: #2457B2; --blue-hover: #1B4690; --rule: #CCD7DE; --control: #6B7C88;
  --danger: #A03631; --warning: #7A4D00; --ok: #2E6A43;
  --tint-1: #DCE6EC; --tint-2: #E6E3D6; --tint-3: #D9E4DA; --tint-4: #EADDD8; --tint-5: #DFDEEA;
  --ui: 'Commissioner Variable', Commissioner, system-ui, sans-serif;
  --read: 'Literata Variable', Literata, Georgia, 'Times New Roman', serif;
  --t-meta: .8125rem; --t-small: .875rem; --t-body: 1rem; --t-lead: 1.25rem; --t-h: 1.5625rem; --t-h1: 1.953rem; --t-title: 2.441rem; --t-display: 3.052rem;
  --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem; --s5: 1.5rem; --s6: 2rem; --s7: 3rem; --s8: 4rem;
  color-scheme: light;
}
[data-theme="dark"] {
  --ground: #111A22; --leaf: #192630; --quiet: #233441; --ink: #EDF3F5; --pencil: #A9B8C2;
  --blue: #8FB4FF; --blue-hover: #B5CCFF; --rule: #2F4352; --control: #7F93A2;
  --danger: #FFAAA4; --warning: #F0C26B; --ok: #8FD3A6;
  --tint-1: #24384A; --tint-2: #3A3628; --tint-3: #263A2D; --tint-4: #3E2B2A; --tint-5: #2E2D42;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 var(--t-body)/1.5 var(--ui); font-optical-sizing: auto; }
a { color: var(--blue); text-underline-offset: .18em; text-decoration-thickness: 1px; }
a:hover { color: var(--blue-hover); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul[role="list"], ul.plain { list-style: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: var(--s4); top: -4rem; background: var(--leaf); padding: var(--s3) var(--s4); z-index: 10; }
.skip:focus { top: var(--s4); }
.meta { color: var(--pencil); font-size: var(--t-small); }
.title { font-family: var(--read); font-weight: 560; line-height: 1.2; letter-spacing: -.005em; text-wrap: balance; overflow-wrap: anywhere; hyphens: auto; }
.author { color: var(--pencil); }
.num { font-variant-numeric: tabular-nums; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px; padding: 0 var(--s4); border-radius: 6px; border: 1px solid var(--control); background: var(--leaf); color: var(--ink); font: 550 var(--t-small)/1.2 var(--ui); text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--ink); color: var(--ink); }
.btn--primary { background: var(--blue); border-color: var(--blue); color: var(--leaf); }
.btn--primary:hover { background: var(--blue-hover); border-color: var(--blue-hover); color: var(--leaf); }
.btn--quiet { border-color: transparent; background: transparent; color: var(--blue); padding: 0 var(--s2); }
.btn--quiet:hover { color: var(--blue-hover); border-color: transparent; text-decoration: underline; }
.btn--danger { color: var(--danger); }
input[type="search"], input[type="text"], select { min-height: 44px; border: 1px solid var(--control); border-radius: 6px; background: var(--leaf); color: var(--ink); font: 400 var(--t-body)/1.2 var(--ui); padding: 0 var(--s3); }
select { padding-right: var(--s5); }
label.field { display: grid; gap: var(--s1); font-size: var(--t-small); font-weight: 550; }

/* Disclosures: one cue everywhere — a chevron that turns, plus text. */
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
.disc > summary { display: inline-flex; align-items: center; gap: var(--s2); min-height: 44px; color: var(--blue); font-weight: 550; font-size: var(--t-small); }
.disc > summary::before { content: ""; width: .45em; height: .45em; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); transition: transform .15s; flex: none; margin-right: .1em; }
.disc[open] > summary::before { transform: rotate(45deg); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.confirm-body { padding: var(--s3) 0 var(--s4) calc(.45em + var(--s3)); display: grid; gap: var(--s3); max-width: 34rem; }

/* Covers */
.cover { --w: 120px; width: var(--w); aspect-ratio: 2 / 3; flex: none; container-type: inline-size; border-radius: 2px 4px 4px 2px; overflow: hidden; position: relative; display: block; }
.cover--fill { width: 100%; }
.cover > .cv { position: absolute; inset: 0; display: flex; flex-direction: column; }
.cover--img { color: #fff; box-shadow: inset 3px 0 0 rgba(0,0,0,.18); }
.cover--img > .cv { padding: 10cqi 9cqi; justify-content: space-between; }
.cover--img .ci-title { font: 650 12cqi/1.05 var(--ui); letter-spacing: -.01em; }
.cover--img .ci-author { font: 500 7.5cqi/1.2 var(--ui); opacity: .9; }
.cover--reclam { background: #F0C419; color: #1A1A1A; }
.cover--reclam .ci-title { border-top: 1.5cqi solid #1A1A1A; padding-top: 5cqi; font-weight: 700; }
.cover--forest { background: #2F4A3C; }
.cover--forest .ci-title { font: 500 13cqi/1.05 var(--read); font-style: italic; }
.cover--oxblood { background: #6A2B2E; }
.cover--oxblood .ci-title { font: 700 15cqi/.95 var(--ui); text-transform: none; }
.cover--ink { background: linear-gradient(160deg, #23384F 0 55%, #C9B48A 55% 100%); }
.cover--ink .ci-author { color: #23384F; }
.cover--sea { background: #1D5F7A; }
.cover--sea .ci-title { font: 600 12cqi/1.05 var(--read); }
.cover--type { background: var(--tint); color: var(--ink); border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
.cover--type > .cv { padding: 11cqi 10cqi; gap: 6cqi; }
.cover--type > .cv::after { content: ""; position: absolute; inset: 5cqi; border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); pointer-events: none; }
.cover--type .ct-long { font-size: 9.5cqi !important; }
.cover--type .ct-title { font: 560 12.5cqi/1.12 var(--read); overflow-wrap: break-word; hyphens: auto; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.cover--type .ct-author { font: 400 8cqi/1.2 var(--ui); color: var(--pencil); }
.cover--type .ct-note { margin-top: auto; font: 500 7.5cqi/1.2 var(--ui); color: var(--pencil); }
.cover--initial > .cv { align-items: center; justify-content: center; padding: 0; }
.cover--initial .ct-initial { font: 500 48cqi/1 var(--read); color: color-mix(in srgb, var(--ink) 55%, transparent); }

/* Status text with a shape cue */
.status { display: inline-flex; align-items: baseline; gap: .4em; font-size: var(--t-small); font-weight: 550; }
.status::before { content: ""; width: .55em; height: .55em; border-radius: 50%; border: 1.5px solid currentColor; flex: none; transform: translateY(-.05em); }
.status--now { color: var(--blue); } .status--now::before { background: currentColor; }
.status--fail { color: var(--danger); } .status--fail::before { border-radius: 1px; transform: translateY(-.05em) rotate(45deg); }
.status--quiet { color: var(--pencil); }
.status--ok { color: var(--ok); } .status--ok::before { background: currentColor; }

.notice { border-left: 3px solid var(--warning); background: color-mix(in srgb, var(--warning) 7%, var(--leaf)); padding: var(--s3) var(--s4); font-size: var(--t-small); display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); align-items: baseline; }
.notice .disc > summary { min-height: 0; }

.passage { font: 400 1.125rem/1.68 var(--read); max-width: 34em; }
.passage mark, .kw { background: none; color: var(--blue); font-weight: 650; }

/* =========================== Prototype switcher (not part of any design) */
.proto { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #111; color: #fff; border-radius: 999px; font: 500 13px/1 system-ui, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35); white-space: nowrap; }
.proto button, .proto select { background: #2a2a2a; color: #fff; border: 0; border-radius: 999px; height: 30px; padding: 0 10px; font: inherit; cursor: pointer; }
.proto b { padding: 0 6px; }
body { padding-bottom: 72px; }

/* =========================== A — Margin notes */
.vA .bar { background: var(--leaf); border-bottom: 1px solid var(--rule); }
.vA .bar-in { max-width: 76rem; margin: 0 auto; padding: var(--s2) var(--s5); display: flex; align-items: center; gap: var(--s5); }
.vA .mark { font: 600 1.25rem/1 var(--read); color: var(--ink); text-decoration: none; letter-spacing: -.01em; }
.vA .nav ul { display: flex; gap: var(--s1); list-style: none; }
.vA .nav a { display: flex; align-items: center; min-height: 44px; padding: 0 var(--s3); color: var(--ink); text-decoration: none; font-weight: 500; border-radius: 6px; }
.vA .nav a:hover { background: var(--quiet); }
.vA .nav a[aria-current] { color: var(--blue); box-shadow: inset 0 -2px 0 var(--blue); border-radius: 0; font-weight: 650; }
.vA .tools { margin-left: auto; display: flex; align-items: center; gap: var(--s3); }
.vA .tools label { display: flex; align-items: center; gap: var(--s2); font-size: var(--t-small); color: var(--pencil); }
.account { position: relative; }
.account > summary { display: flex; align-items: center; gap: var(--s2); min-height: 44px; padding: 0 var(--s2); font-size: var(--t-small); color: var(--pencil); }
.account > summary::after { content: ""; width: .4em; height: .4em; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translateY(-.15em); }
.account[open] > summary::after { transform: rotate(-135deg); }
.account .panel { position: absolute; right: 0; top: 100%; background: var(--leaf); border: 1px solid var(--rule); border-radius: 6px; padding: var(--s3); display: grid; gap: var(--s2); min-width: 12rem; z-index: 5; }
.vA main { max-width: 76rem; margin: 0 auto; padding: var(--s6) var(--s5) var(--s8); }
.vA .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2) var(--s4); margin-bottom: var(--s4); }
.vA h1:not(.title) { font: 650 var(--t-h)/1.2 var(--ui); letter-spacing: -.01em; }
.vA h2:not(.title) { font: 650 var(--t-lead)/1.3 var(--ui); }
.vA .grid { display: grid; grid-template-columns: minmax(0, 1fr) 18rem; column-gap: var(--s6); }
.vA .find { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.vA .find input { flex: 1 1 16rem; max-width: 28rem; }
.tabs { display: flex; flex-wrap: wrap; gap: var(--s1); list-style: none; }
.tabs a { display: inline-flex; align-items: center; gap: .35em; min-height: 44px; padding: 0 var(--s3); border-radius: 6px; color: var(--ink); text-decoration: none; font-size: var(--t-small); font-weight: 550; }
.tabs a:hover { background: var(--quiet); }
.tabs a[aria-current] { background: var(--ink); color: var(--ground); }
.tabs .n { color: inherit; opacity: .7; font-variant-numeric: tabular-nums; font-weight: 450; }
.vA .controls { display: grid; gap: var(--s3); margin-bottom: var(--s5); }
.vA .entries { list-style: none; }
.vA .entry { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr) 18rem; column-gap: var(--s5); padding: var(--s4) 0; }
.vA .entry + .entry { border-top: 1px solid var(--rule); }
.vA .entry .title { font-size: var(--t-lead); }
.vA .entry .title a { color: var(--ink); text-decoration: none; }
.vA .entry .title a:hover { text-decoration: underline; }
.vA .entry .acts { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-top: var(--s3); }
.vA .margin { font-size: var(--t-small); color: var(--pencil); display: grid; gap: var(--s2); align-content: start; padding-left: var(--s4); border-left: 2px solid var(--quiet); }
.vA .margin p { max-width: 30ch; }
.vA .titlepage { display: grid; grid-template-columns: 13rem minmax(0, 1fr); gap: var(--s6); align-items: start; }
.vA .titlepage .title { font-size: var(--t-display); font-weight: 520; }
.vA .titlepage .author { font: 400 var(--t-lead)/1.4 var(--read); margin-top: var(--s2); }
.vA .lifecycle { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); margin-top: var(--s5); align-items: start; }
.vA .lifecycle > .disc { flex-basis: 100%; }
.vA .lifecycle > .disc:not([open]) { flex-basis: auto; }
.vA .apparatus { display: grid; gap: var(--s5); align-content: start; }
.vA .apparatus dt { font-weight: 650; color: var(--ink); font-size: var(--t-small); }
.vA .apparatus dd { color: var(--pencil); font-size: var(--t-small); display: grid; gap: var(--s2); margin-top: var(--s1); }
.vA .apparatus .btns { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s1); }
.vA .section { margin-top: var(--s7); }
.vA .section > h2 { margin-bottom: var(--s3); }
/* KWIC */
.vA .qform { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: end; }
.vA .qform input { width: 14rem; }
.vA .scopes { display: flex; flex-wrap: wrap; gap: 0 var(--s5); }
.vA .summary { margin: var(--s4) 0 var(--s5); font-size: var(--t-small); }
.vA .summary strong { font-size: var(--t-body); }
.vA .kgroup { display: grid; grid-template-columns: 12rem minmax(0, 1fr); column-gap: var(--s5); padding: var(--s4) 0; }
.vA .kgroup + .kgroup { border-top: 1px solid var(--rule); }
.vA .kgroup > h3 { font: 560 1rem/1.3 var(--read); font-style: italic; }
.vA .kgroup > h3 .meta { display: block; font: 400 var(--t-meta)/1.4 var(--ui); font-style: normal; margin-top: var(--s1); }
.vA .klist { list-style: none; }
.vA .krow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
.vA .krow > details > summary { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr) max-content minmax(0, 1.25fr); align-items: baseline; column-gap: .4em; min-height: 44px; padding: .55rem 0; font: 400 1.0625rem/1.5 var(--read); }
.vA .krow > details > summary::before { content: ""; width: .42em; height: .42em; border-right: 2px solid var(--blue); border-bottom: 2px solid var(--blue); transform: rotate(-45deg); transition: transform .15s; align-self: center; }
.vA .krow > details[open] > summary::before { transform: rotate(45deg); }
.vA .krow .l { text-align: right; white-space: nowrap; overflow: hidden; direction: rtl; text-overflow: ellipsis; }
.vA .krow .l > span { direction: ltr; unicode-bidi: isolate; }
.vA .krow .r { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vA .krow .study { min-height: 44px; display: inline-flex; align-items: center; padding: 0 var(--s2); font-size: var(--t-small); }
.ctx { padding: var(--s2) 0 var(--s4) 1.65rem; display: grid; gap: var(--s3); }
.ctx dl { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s5); font-size: var(--t-meta); color: var(--pencil); }
.ctx dt { display: inline; font-weight: 650; color: var(--ink); }
.ctx dd { display: inline; margin-left: .3em; }
.ctx .passage { font-size: 1.0625rem; }
.ctx .dim { color: var(--pencil); }
.pager { display: flex; gap: var(--s3); align-items: center; margin-top: var(--s5); }

@media (max-width: 52rem) {
  .vA .bar-in { flex-wrap: wrap; gap: 0 var(--s3); padding: var(--s1) var(--s4); }
  .vA .mark { order: 0; }
  .vA .tools { order: 1; }
  .vA .nav { order: 2; flex-basis: 100%; }
  .vA .nav ul { justify-content: space-between; }
  .vA .nav a { padding: 0 var(--s2); }
  .vA .tools label .lbl { display: none; }
  .vA main { padding: var(--s4) var(--s4) var(--s7); }
  .vA .grid { grid-template-columns: minmax(0, 1fr); }
  .vA .entry { grid-template-columns: 4rem minmax(0, 1fr); column-gap: var(--s4); }
  .vA .entry .margin { grid-column: 2; border-left: 0; padding-left: 0; margin-top: var(--s2); }
  .vA .titlepage { grid-template-columns: 6.5rem minmax(0, 1fr); gap: var(--s4); }
  .vA .titlepage .title { font-size: var(--t-h1); }
  .vA .titlepage .author { font-size: var(--t-body); }
  .vA .titlepage .lifecycle { grid-column: 1 / -1; }
  .vA .apparatus { margin-top: var(--s5); padding: var(--s4); background: var(--leaf); border-radius: 6px; }
  .vA .kgroup { grid-template-columns: minmax(0, 1fr); row-gap: var(--s2); }
  .vA .krow > details > summary { grid-template-columns: 1.25rem minmax(0, 1fr); }
  .vA .krow .l, .vA .krow .r { white-space: normal; direction: ltr; text-align: left; display: inline; }
  .vA .krow .sent { grid-column: 2; }
}

/* =========================== B — Shelf */
.vB .frame { display: grid; grid-template-columns: 13rem minmax(0, 1fr); min-height: 100vh; }
.vB .rail { background: var(--quiet); padding: var(--s5) var(--s4); display: flex; flex-direction: column; gap: var(--s5); position: sticky; top: 0; height: 100vh; }
.vB .mark { font: 600 1.375rem/1 var(--read); color: var(--ink); text-decoration: none; padding-left: var(--s3); }
.vB .nav ul { list-style: none; display: grid; gap: 2px; }
.vB .nav a { display: flex; align-items: center; min-height: 44px; padding: 0 var(--s3); border-radius: 6px; color: var(--ink); text-decoration: none; font-weight: 500; }
.vB .nav a:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.vB .nav a[aria-current] { background: var(--leaf); font-weight: 650; box-shadow: inset 3px 0 0 var(--blue); }
.vB .railfoot { margin-top: auto; display: grid; gap: var(--s3); }
.vB .railfoot select { width: 100%; }
.vB .railfoot label { display: grid; gap: var(--s1); font-size: var(--t-meta); color: var(--pencil); font-weight: 550; }
.vB .account .panel { bottom: 100%; top: auto; left: 0; right: auto; }
.vB main { padding: var(--s6) var(--s6) var(--s8); max-width: 72rem; width: 100%; }
.vB h1:not(.title) { font: 650 var(--t-h)/1.2 var(--ui); letter-spacing: -.01em; }
.vB h2:not(.title) { font: 650 var(--t-lead)/1.3 var(--ui); }
.vB .head { display: flex; flex-wrap: wrap; gap: var(--s3) var(--s5); align-items: center; justify-content: space-between; margin-bottom: var(--s3); }
.vB .find { display: flex; gap: var(--s2); }
.vB .find input { width: 18rem; }
.vB .controls { display: grid; gap: var(--s3); margin-bottom: var(--s5); }
.vB .shelf { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(9.5rem, 1fr)); gap: var(--s6) var(--s5); }
.vB .book { display: grid; gap: var(--s2); align-content: start; }
.vB .book .cover { margin-bottom: var(--s1); }
.vB .book .title { font-size: 1.0625rem; }
.vB .book .title a { color: var(--ink); text-decoration: none; }
.vB .book .title a:hover { text-decoration: underline; }
.vB .book .author { font-size: var(--t-small); }
.vB .book .disc > summary { min-height: 36px; }
.vB .book .confirm-body { padding-left: 0; }
.vB .spread { display: grid; grid-template-columns: minmax(12rem, 18rem) minmax(0, 1fr); background: var(--leaf); border-radius: 8px; overflow: hidden; }
.vB .spread .lpage { background: var(--quiet); padding: var(--s6); display: grid; place-items: center; }
.vB .spread .rpage { padding: var(--s6); display: grid; gap: var(--s4); align-content: start; }
.vB .spread .title { font-size: var(--t-title); font-weight: 520; }
.vB .spread .author { font: 400 var(--t-lead)/1.4 var(--read); }
.vB .ledger { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0 var(--s5); margin-top: var(--s3); }
.vB .ledger > dt, .vB .ledger > dd { padding: var(--s3) 0; border-top: 1px solid var(--rule); }
.vB .ledger > dt { font-weight: 650; font-size: var(--t-small); }
.vB .ledger > dd { font-size: var(--t-small); color: var(--pencil); display: grid; gap: var(--s2); }
.vB .ledger .btns { display: flex; flex-wrap: wrap; gap: var(--s2); }
.vB .lifecycle { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); padding-top: var(--s3); border-top: 1px solid var(--rule); }
.vB .lifecycle > .disc[open] { flex-basis: 100%; }
.vB .row-shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 9rem; gap: var(--s5); overflow-x: auto; padding: var(--s2) var(--s1) var(--s4); list-style: none; scroll-snap-type: x proximity; }
.vB .row-shelf > li { scroll-snap-align: start; }
.vB .section { margin-top: var(--s7); }
.vB .section > h2 { margin-bottom: var(--s1); }
.vB .section > .meta { margin-bottom: var(--s4); }
.vB .qform { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: end; }
.vB .qform input { width: 14rem; }

  if (b.state === 'inbox') return `<button class="btn">Move to To Read</button>`;

}
function moreActions(b) {

}
function filteredBooks() { return D.books; }
const counts = () => ({ all: D.books.length, inbox: D.books.filter(b => b.state === 'inbox').length, to_read: D.books.filter(b => ['to_read', 'now'].includes(b.state)).length, aside: D.books.filter(b => b.state === 'aside').length, read: D.books.filter(b => b.state === 'read').length });
function tabs() {

}
function waitingNotice() {

}
function findForm(id) { return `<form class="find" role="search" onsubmit="return false"><label class="sr" for="${id}">Search My Books</label><input id="${id}" type="search" placeholder="Title, author, or edition"><button class="btn">Search</button></form>`; }
function lifecycle(book) {
  return `
  <details class="disc"><summary>Finish this Book</summary><div class="confirm-body">
    <p>Finishing records <i>${book.title}</i> as Read and adds its ${D.current.reserved} reserved words to your Known vocabulary. It doesn't claim you've mastered every card.</p>

  <a class="btn btn--quiet" href="${url({ screen: 'chooser' })}">Switch to another Book</a>
  <details class="disc"><summary>Stop reading for now</summary><div class="confirm-body">
    <p><i>${book.title}</i> goes back to To Read. Its analysis and history are kept.</p>
    <div><button class="btn">Stop reading</button></div></div></details>
  <details class="disc"><summary>Set aside</summary><div class="confirm-body">
    <p><i>${book.title}</i> moves to Set aside. Its analysis, deck, and history are kept, and you can move it back to To Read at any time.</p>
    <div><button class="btn btn--danger">Set aside</button></div></div></details>`;
}
const BANDS = [['99plus', '99% or more of running words Known'], ['97to99', '97–99% Known'], ['95to97', '95–97% Known'], ['below95', 'Below 95% Known'], ['none', 'Evidence not ready']];

const candidates = () => D.books.filter(b => b.state === 'to_read').sort((x, y) => sortKey(x.title).localeCompare(sortKey(y.title), S.lang));
function startConfirm(b) {

function qform() {

document.documentElement.dataset.theme = S.theme;
document.documentElement.lang = 'en';
document.body.className = 'v' + S.variant + (S.fonts === 'fallback' ? ' fallback' : '');
const body = S.screen === 'type' ? specimen() : (V[S.screen] || V.books)();
document.getElementById('app').innerHTML = V.shell(body) + `
  <div class="proto" aria-label="Prototype switcher (not part of the design)">
    <button data-go="-1" aria-label="Previous variant">←</button><b>${S.variant} — ${VARIANTS[S.variant]}</b><button data-go="1" aria-label="Next variant">→</button>
    <select id="proto-screen">${Object.entries(SCREENS).map(([k, v]) => `<option value="${k}"${k === S.screen ? ' selected' : ''}>${v}</option>`).join('')}</select>
    <button id="proto-theme">${S.theme === 'dark' ? 'Light' : 'Dark'}</button>
  </div>`;
// Wrap KWIC sentence parts so compact layouts can reflow them as one sentence.
document.querySelectorAll('.krow summary, .ktable summary').forEach(s => {
  const parts = s.querySelectorAll('.l, .kw, .r');
  if (matchMedia('(max-width: 52rem)').matches) { const w = document.createElement('span'); w.className = 'sent'; parts.forEach((p, i) => { w.append(p); if (i < 2) w.append(' '); }); s.append(w); }
});
const keys = Object.keys(VARIANTS);
const go = (d) => { location.search = url({ variant: keys[(keys.indexOf(S.variant) + d + keys.length) % keys.length] }); };
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
document.getElementById('proto-screen').onchange = (e) => { location.search = url({ screen: e.target.value }); };
document.getElementById('proto-theme').onclick = () => { location.search = url({ theme: S.theme === 'dark' ? 'light' : 'dark' }); };
addEventListener('keydown', (e) => { if (e.target.closest('input, textarea, select, [contenteditable]')) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });
</script>
</body>
</html>
