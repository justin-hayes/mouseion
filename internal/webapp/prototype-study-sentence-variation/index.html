<!-- ===================================================================
     Pure Study logic. No DOM. The page below is a thin shell over it.
     =================================================================== -->
<script>
const Study = (() => {
  // Pilot spacing ladder, uncompressed: 1, 3, 7, 16, 35 days, then x2.2, capped at 180.
  const LADDER = (() => {
    const l = [1, 3, 7, 16, 35];
    while (l[l.length - 1] < 180) l.push(Math.min(180, Math.round(l[l.length - 1] * 2.2)));
    return l;
  })();
  // Trial scaling: the pilot offers batches of 10. With 20 words, batches of 5 and at
  // most 3 per Study day keep a "third batch" decision possible.
  const BATCH_SIZE = 5;
  const BATCHES_PER_DAY = 3;
  const DAY_START_HOUR = 5;
  const TIME_ZONE = "Europe/Berlin";
  // Sentence slot per scheduled review (1-based review number, cycling). Slot 0 is the
  // first (familiar) sentence. Half the words start on the familiar sentence, half on a
  // new one, so new sentences are not confined to later, longer intervals.
  const SEQ_FAMILIAR_FIRST = [0, 1, 0, 2];
  const SEQ_NEW_FIRST = [1, 0, 2, 0];

  const fmt = new Intl.DateTimeFormat("en-CA", {
    timeZone: TIME_ZONE, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23",
  });

  /** Study day number (days since 1970-01-01) for an instant; the day begins 05:00 Europe/Berlin. */
  function studyDay(date) {
    const p = Object.fromEntries(fmt.formatToParts(date).map((x) => [x.type, x.value]));
    let day = Date.UTC(+p.year, +p.month - 1, +p.day) / 86400000;
    if (+p.hour < DAY_START_HOUR) day -= 1;
    return day;
  }
  function dayLabel(day) {
    return new Date(day * 86400000).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
  }

  function init(material, now) {
    return {
      v: 1, createdAt: now.toISOString(), introCount: 0,
      words: {}, // id -> study progress
      nominations: [],
      today: null,
      log: [],
    };
  }

  const inStudy = (s, id) => s.words[id] && s.words[id].introducedDay != null;

  function pool(s, material) {
    const pending = new Set((s.today?.queue || []).filter((c) => c.kind === "intro").map((c) => c.wordId));
    const free = (id) => !inStudy(s, id) && !pending.has(id);
    const noms = s.nominations.filter(free);
    const rest = material.map((w) => w.id).filter((id) => free(id) && !noms.includes(id));
    return [...noms, ...rest];
  }

  function reviewCard(s, id) {
    const p = s.words[id];
    const seq = p.familiarFirst ? SEQ_FAMILIAR_FIRST : SEQ_NEW_FIRST;
    const reviewNo = p.reviews + 1;
    const slot = seq[(reviewNo - 1) % seq.length];
    const novelty = slot === 0 ? "first" : p.seen[slot] ? "seen" : "unseen";
    return { wordId: id, slot, kind: "review", novelty, reviewNo };
  }

  /** Start a new Study day if the day has changed. Idempotent within a day. */
  function openDay(s, material, now) {
    const day = studyDay(now);
    if (s.today && s.today.day === day) return s;
    s = structuredClone(s);
    const due = Object.keys(s.words)
      .filter((id) => inStudy(s, id) && s.words[id].dueDay <= day)
      .sort((a, b) => s.words[a].dueDay - s.words[b].dueDay || s.words[a].introOrder - s.words[b].introOrder);
    // Unfinished intros from the previous day go back to the front of the pool.
    const leftoverIntros = (s.today?.queue || []).filter((c) => c.kind === "intro").map((c) => c.wordId);
    s.nominations = [...leftoverIntros, ...s.nominations.filter((id) => !leftoverIntros.includes(id))];
    s.today = {
      day, dueAtStart: due, queue: due.map((id) => reviewCard(s, id)),
      batchesTaken: 0, declined: false, finishedAt: due.length ? null : now.toISOString(),
    };
    s.log.push({ t: "day_start", at: now.toISOString(), day, due: due.length });
    return s;
  }

  function phase(s, material) {
    const t = s.today;
    if (t.queue.length) return t.finishedAt ? "new-words" : "reviews";
    if (!t.declined && t.batchesTaken < BATCHES_PER_DAY && pool(s, material).length) return "offer";
    return "done";
  }

  function remainingReviews(s) {
    return s.today.finishedAt ? 0 : s.today.queue.length;
  }

  /** Grade the card at the front of the queue. */
  function grade(s, material, { grade, guessed }, now) {
    s = structuredClone(s);
    const t = s.today;
    const card = t.queue.shift();
    if (!card) return s;
    const p = s.words[card.wordId];
    const rungBefore = p.rung;
    let repeat = false;

    if (card.kind === "intro") {
      if (p.introducedDay == null) { p.introducedDay = t.day; }
      p.seen[0] = true;
      if (grade === "got") { p.rung = 1; p.dueDay = t.day + LADDER[0]; }
      else { p.rung = 0; p.dueDay = t.day + 1; repeat = true; }
    } else if (card.kind === "review") {
      p.reviews += 1;
      p.seen[card.slot] = true;
      if (grade === "got") { p.rung = Math.min(p.rung + 1, LADDER.length); p.dueDay = t.day + LADDER[p.rung - 1]; }
      else { p.rung = Math.max(0, p.rung - 2); p.dueDay = t.day + 1; repeat = true; }
    } else { // repeat: comes back once more before Today finishes; no climb on Got it
      if (grade === "got") p.dueDay = t.day + LADDER[Math.max(p.rung, 1) - 1];
      else repeat = true;
    }
    if (repeat) t.queue.push({ wordId: card.wordId, slot: card.slot, kind: "repeat", novelty: "repeat", reviewNo: card.reviewNo });

    s.log.push({
      t: "grade", at: now.toISOString(), day: t.day, word: card.wordId, kind: card.kind,
      slot: card.slot, sentence: card.slot === 0 ? "first" : "new", novelty: card.novelty,
      reviewNo: card.reviewNo ?? 0, grade, guessed: !!guessed, rungBefore, rungAfter: p.rung, dueDay: p.dueDay,
    });
    if (!t.finishedAt && !t.queue.some((c) => c.kind !== "intro")) t.finishedAt = now.toISOString();
    return s;
  }

  function nextBatch(s, material) { return pool(s, material).slice(0, BATCH_SIZE); }

  function takeBatch(s, material, now) {
    s = structuredClone(s);
    const ids = nextBatch(s, material);
    for (const id of ids) {
      s.words[id] = s.words[id] || {
        introOrder: s.introCount, familiarFirst: s.introCount % 2 === 0,
        introducedDay: null, rung: 0, dueDay: null, reviews: 0, seen: [false, false, false],
      };
      s.introCount += 1;
      s.today.queue.push({ wordId: id, slot: 0, kind: "intro", novelty: "intro", reviewNo: 0 });
    }
    s.nominations = s.nominations.filter((id) => !ids.includes(id));
    s.today.batchesTaken += 1;
    s.log.push({ t: "batch", at: now.toISOString(), day: s.today.day, choice: "take", n: s.today.batchesTaken, words: ids });
    return s;
  }

  function declineBatch(s, material, now) {
    s = structuredClone(s);
    s.today.declined = true;
    s.log.push({ t: "batch", at: now.toISOString(), day: s.today.day, choice: "decline", n: s.today.batchesTaken + 1, words: nextBatch(s, material) });
    return s;
  }

  function exploreView(s, id, now) {
    s = structuredClone(s);
    s.log.push({ t: "explore_view", at: now.toISOString(), day: s.today.day, word: id });
    return s;
  }

  function nominate(s, id, now) {
    if (s.nominations.includes(id) || inStudy(s, id)) return s;
    s = structuredClone(s);
    s.nominations.push(id);
    s.log.push({ t: "nominate", at: now.toISOString(), day: s.today.day, word: id });
    return s;
  }

  function note(s, text, now) {
    s = structuredClone(s);
    s.log.push({ t: "note", at: now.toISOString(), day: s.today.day, text });
    return s;
  }

  /** Again rates by sentence novelty, over scheduled reviews only (not intros or same-day repeats). */
  function stats(s) {
    const rows = {};
    for (const e of s.log) {
      if (e.t !== "grade") continue;
      const k = e.kind === "review" ? e.novelty : e.kind; // first | unseen | seen | intro | repeat
      const r = (rows[k] ||= { n: 0, again: 0, guessed: 0, guessedAgain: 0 });
      r.n += 1;
      if (e.grade === "again") r.again += 1;
      if (e.guessed) { r.guessed += 1; if (e.grade === "again") r.guessedAgain += 1; }
    }
    const sum = (keys) => keys.reduce((a, k) => {
      const r = rows[k]; if (!r) return a;
      return { n: a.n + r.n, again: a.again + r.again, guessed: a.guessed + r.guessed, guessedAgain: a.guessedAgain + r.guessedAgain };
    }, { n: 0, again: 0, guessed: 0, guessedAgain: 0 });
    return {
      first: sum(["first"]), unseen: sum(["unseen"]), seen: sum(["seen"]), anyNew: sum(["unseen", "seen"]),
      intro: sum(["intro"]), repeat: sum(["repeat"]),
    };
  }

  return { LADDER, BATCH_SIZE, BATCHES_PER_DAY, studyDay, dayLabel, init, openDay, phase, remainingReviews, grade,
    nextBatch, takeBatch, declineBatch, pool, exploreView, nominate, note, stats, inStudy };
})();
</script>

<!-- ===================================================================
     Page shell: rendering, localStorage, export. Throwaway.
     =================================================================== -->
<script>
const material = JSON.parse(document.getElementById("study-material").textContent);
const byId = Object.fromEntries(material.map((w) => [w.id, w]));
const params = new URLSearchParams(location.search);
const TEST = params.has("test");
const KEY = TEST ? "mouseion-study-proto-TEST" : "mouseion-study-proto";
const OFFSET_KEY = KEY + ":dayOffset";

function now() {
  const off = TEST ? +(localStorage.getItem(OFFSET_KEY) || 0) : 0;
  return new Date(Date.now() + off * 86400000);
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) { console.error(e); }
  return Study.init(material, now());
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

let state = Study.openDay(load(), material, now());
save();
let undoStack = [];
let revealed = false;
let guessed = false;
let view = "study";
let explore = { pos: 0, revealed: false };

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const marked = (de) => esc(de).replace(/\[\[(.+?)\]\]/g, "<mark>$1</mark>");
const pct = (r) => (r.n ? Math.round((100 * r.again) / r.n) + "%" : "–");

function dispatch(next) {
  undoStack.push(state);
  if (undoStack.length > 20) undoStack.shift();
  state = next;
  save();
  render();
}

function renderTestbar() {
  if (!TEST) return;
  const off = +(localStorage.getItem(OFFSET_KEY) || 0);
  $("#testbar").innerHTML = `<div class="testbar">TEST MODE: separate storage. Day offset ${off}.
    <button class="link" id="tNext">Jump to next Study day</button> ·
    <button class="link" id="tReset">Reset test data</button></div>`;
  $("#tNext").onclick = () => { localStorage.setItem(OFFSET_KEY, off + 1); state = Study.openDay(state, material, now()); save(); render(); };
  $("#tReset").onclick = () => { localStorage.removeItem(KEY); localStorage.removeItem(OFFSET_KEY); location.reload(); };
}

function render() {
  state = Study.openDay(state, material, now());
  renderTestbar();
  const t = state.today;
  $("#dayLabel").innerHTML = `Study day <strong>${Study.dayLabel(t.day)}</strong>`;
  const left = Study.remainingReviews(state);
  const inStudy = Object.keys(state.words).filter((id) => Study.inStudy(state, id)).length;
  $("#progress").innerHTML = t.finishedAt ? `Today finished · ${inStudy}/20 in study` : `<strong>${left}</strong> review${left === 1 ? "" : "s"} left`;
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false"));
  $("#dock").hidden = true;
  ({ study: renderStudy, explore: renderExplore, stats: renderStats, about: renderAbout })[view]();
}

function dock(html) { $("#dockRow").innerHTML = html; $("#dock").hidden = false; }

function renderStudy() {
  const ph = Study.phase(state, material);
  if (ph === "reviews" || ph === "new-words") return renderCard();
  if (ph === "offer") {
    const batch = Study.nextBatch(state, material);
    const n = state.today.batchesTaken + 1;
    const noms = batch.filter((id) => state.nominations.includes(id)).length;
    $("#view").innerHTML = `<h1>${state.today.dueAtStart.length ? "Reviews done." : "No reviews due today."}</h1>
      <p>New-word batch ${n} of up to ${Study.BATCHES_PER_DAY} today: <strong>${batch.length} words</strong>${noms ? ` (${noms} saved in Explore)` : ""}.
      Taking it introduces them now; they start coming back tomorrow.</p>
      ${undoLink()}`;
    dock(`<button id="decline">Not today</button><button class="primary" id="take">Take ${batch.length} words</button>`);
    $("#take").onclick = () => { revealed = false; guessed = false; dispatch(Study.takeBatch(state, material, now())); };
    $("#decline").onclick = () => dispatch(Study.declineBatch(state, material, now()));
    bindUndo();
    return;
  }
  // done
  const poolLeft = Study.pool(state, material).length;
  const notesToday = state.log.filter((e) => e.t === "note" && e.day === state.today.day);
  $("#view").innerHTML = `<h1>Today is finished.</h1>
    <p class="muted">${state.today.declined ? "You declined the next New-word batch." : poolLeft ? `That's the ${Study.BATCHES_PER_DAY} batches for today.` : "All 20 words are in study."}
    Come back after 05:00 tomorrow.${poolLeft ? " Explore is open if you want to flip through words that aren't in study yet." : ""}</p>
    <h2>How did today feel?</h2>
    <p class="small muted">Optional. Did "Got it" on a new sentence mean you knew the word, or that you worked the sentence out? Did a batch, or Explore, feel like a penalty?</p>
    <textarea id="note" placeholder="A sentence or two is plenty."></textarea>
    <div class="actions"><button class="primary" id="saveNote">Save note</button></div>
    ${notesToday.map((e) => `<p class="small">✓ Saved ${new Date(e.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}: ${esc(e.text)}</p>`).join("")}
    ${undoLink()}`;
  $("#saveNote").onclick = () => { const v = $("#note").value.trim(); if (v) dispatch(Study.note(state, v, now())); };
  bindUndo();
}

function undoLink() { return undoStack.length ? `<p><button class="link" id="undo">Undo last answer</button></p>` : ""; }
function bindUndo() { const u = $("#undo"); if (u) u.onclick = () => { state = undoStack.pop(); revealed = false; guessed = false; save(); render(); }; }

function renderCard() {
  const card = state.today.queue[0];
  const w = byId[card.wordId];
  const s = w.sentences[card.slot];
  const badge = card.kind === "intro" ? "New word" : card.kind === "repeat" ? "Once more" : "Review";
  $("#view").innerHTML = `<div class="card">
      <div class="badge">${badge}</div>
      <p class="de" lang="de">${marked(s.de)}</p>
      ${revealed ? `<div class="back">
        <div><span class="head" lang="de">${esc(w.headword)}</span> <span class="muted small">${esc(w.upos.toLowerCase())}</span></div>
        <div class="gloss">${esc(w.gloss)}</div>
        <p class="en">${esc(s.en)}</p>
      </div>
      ${card.kind === "intro" ? "" : `<label class="toggle ${guessed ? "on" : ""}" id="guessLabel"><input type="checkbox" id="guess" ${guessed ? "checked" : ""}> Felt like guessing from context</label>`}` : ""}
    </div>
    ${undoLink()}`;
  if (revealed) {
    dock(`<button class="again" id="again">Again</button><button class="got" id="got">Got it</button>`);
    const g = $("#guess");
    if (g) g.onchange = () => { guessed = g.checked; $("#guessLabel").classList.toggle("on", guessed); };
    const answer = (grade) => { const gs = guessed; revealed = false; guessed = false; dispatch(Study.grade(state, material, { grade, guessed: gs }, now())); window.scrollTo(0, 0); };
    $("#again").onclick = () => answer("again");
    $("#got").onclick = () => answer("got");
  } else {
    dock(`<button class="primary" id="reveal">Show answer</button>`);
    $("#reveal").onclick = () => { revealed = true; render(); };
  }
  bindUndo();
}

function renderExplore() {
  if (!state.today.finishedAt) {
    $("#view").innerHTML = `<h1>Explore</h1><p class="muted">Explore opens once Today's reviews are done.</p>`;
    return;
  }
  // Ungraded card flipping over words not yet in study (nor being introduced today),
  // in their first sentence only, so the new sentences stay unseen for the reviews.
  const pending = new Set(state.today.queue.filter((c) => c.kind === "intro").map((c) => c.wordId));
  const deck = material.map((w) => w.id).filter((id) => !Study.inStudy(state, id) && !pending.has(id));
  if (!deck.length) {
    $("#view").innerHTML = `<h1>Explore</h1><p class="muted">Every word is in study or being introduced today, so there's nothing new to explore.</p>`;
    return;
  }
  if (explore.pos >= deck.length) {
    $("#view").innerHTML = `<h1>That's all of them.</h1>
      <p class="muted">You've flipped through all ${deck.length} words that aren't in study yet. ${state.nominations.length ? `${state.nominations.length} saved for a New-word batch.` : ""}</p>`;
    dock(`<button class="primary" id="again-explore">Start over</button>`);
    $("#again-explore").onclick = () => { explore = { pos: 0, revealed: false }; render(); };
    return;
  }
  const id = deck[explore.pos];
  const w = byId[id], s = w.sentences[0], saved = state.nominations.includes(id);
  $("#view").innerHTML = `<div class="card">
      <div class="badge">Explore · ${explore.pos + 1} of ${deck.length} · not graded</div>
      <p class="de" lang="de">${marked(s.de)}</p>
      ${explore.revealed ? `<div class="back">
        <div><span class="head" lang="de">${esc(w.headword)}</span> <span class="muted small">${esc(w.upos.toLowerCase())}</span></div>
        <div class="gloss">${esc(w.gloss)}</div>
        <p class="en">${esc(s.en)}</p>
        ${saved ? `<p class="small muted">✓ Saved: it takes a slot in your next New-word batch.</p>` : ""}
      </div>` : ""}
    </div>
    <p class="small muted">Nothing here changes Study progress. Saving a word only moves it to the front of the next New-word batch; it never adds a batch.</p>`;
  if (explore.revealed) {
    dock(`<button id="saveWord" ${saved ? "disabled" : ""}>${saved ? "Saved" : "Save for a batch"}</button><button class="primary" id="nextWord">Next</button>`);
    $("#saveWord").onclick = () => dispatch(Study.nominate(state, id, now()));
    // A saved word leaves no gap: it stays in the deck until introduced, so advance past it.
    $("#nextWord").onclick = () => { explore = { pos: explore.pos + 1, revealed: false }; render(); window.scrollTo(0, 0); };
  } else {
    dock(`<button class="primary" id="revealExplore">Show answer</button>`);
    $("#revealExplore").onclick = () => { explore.revealed = true; state = Study.exploreView(state, id, now()); save(); render(); };
  }
}

function exportPayload() {
  return {
    prototype: "study-sentence-variation", exportedAt: new Date().toISOString(), testMode: TEST,
    settings: { ladder: Study.LADDER, batchSize: Study.BATCH_SIZE, batchesPerDay: Study.BATCHES_PER_DAY, dayStarts: "05:00 Europe/Berlin" },
    stats: Study.stats(state), progress: state.words, nominations: state.nominations, log: state.log,
  };
}

function renderStats() {
  const st = Study.stats(state);
  const row = (label, r) => `<tr><td>${label}</td><td class="num">${r.n}</td><td class="num">${r.again}</td><td class="num">${pct(r)}</td><td class="num">${r.guessed}</td></tr>`;
  const batches = state.log.filter((e) => e.t === "batch");
  const days = [...new Set(state.log.filter((e) => e.t === "day_start").map((e) => e.day))].length;
  $("#view").innerHTML = `<h1>Results</h1>
    <p class="small muted">Scheduled reviews only. Introductions and same-day "once more" repeats are listed separately.</p>
    <table><thead><tr><th>Sentence</th><th class="num">Reviews</th><th class="num">Again</th><th class="num">Again rate</th><th class="num">Guessing</th></tr></thead><tbody>
      ${row("First (familiar)", st.first)}
      ${row("New, never seen", st.unseen)}
      ${row("New, seen before", st.seen)}
      ${row("<strong>All new</strong>", st.anyNew)}
      ${row('<span class="muted">Introductions</span>', st.intro)}
      ${row('<span class="muted">Once-more repeats</span>', st.repeat)}
    </tbody></table>
    <p class="small muted">${days} Study day${days === 1 ? "" : "s"} · batches taken ${batches.filter((b) => b.choice === "take").length}, declined ${batches.filter((b) => b.choice === "decline").length}
      · third batches taken ${batches.filter((b) => b.choice === "take" && b.n === 3).length}</p>
    <h2>Export</h2>
    <div class="actions"><button class="primary" id="dl">Download log (JSON)</button><button id="show">Show JSON to copy</button></div>
    <textarea id="json" hidden readonly></textarea>`;
  $("#dl").onclick = () => {
    const blob = new Blob([JSON.stringify(exportPayload(), null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `study-sentence-variation-${new Date().toISOString().slice(0, 10)}${TEST ? "-TEST" : ""}.json`;
    a.click();
  };
  $("#show").onclick = () => { const t = $("#json"); t.hidden = false; t.value = JSON.stringify(exportPayload()); t.select(); };
}

function renderAbout() {
  $("#view").innerHTML = `<h1>What this prototype asks</h1>
    <p>When a word you're learning comes back in a sentence you've never seen, does <strong>Got it</strong> still mean you know the word, rather than that you worked out the sentence?</p>
    <p class="small">Each word has three sentences from <em>Der ferne Spiegel</em>, all with the same Learned meaning. A word is introduced in its first sentence.
    Its scheduled reviews then alternate between that familiar sentence and the two new ones; half the words start with the familiar sentence, half with a new one.
    Grade honestly, and tick <em>Felt like guessing from context</em> when the sentence, not the word, gave you the answer.</p>
    <h2>Rules, as in the pilot</h2>
    <ul class="small">
      <li>Recognition only: German sentence first, then the Gloss and the sentence translation.</li>
      <li>Spacing: ${Study.LADDER.join(", ")} days. Not compressed. <strong>Got it</strong> climbs one rung; <strong>Again</strong> drops two and the word comes back once more before Today finishes.</li>
      <li>The Study day begins at 05:00 Europe/Berlin. Today is finished once the reviews due at its start are answered.</li>
      <li>New words come after the reviews, in batches you may take or decline. <strong>Scaled for 20 words:</strong> batches of ${Study.BATCH_SIZE} (the pilot uses 10), at most ${Study.BATCHES_PER_DAY} a day.</li>
      <li>Explore is the same card flipping, ungraded, over words not yet in study (first sentence only, so the new sentences stay unseen). A saved word takes a slot at the front of the next batch.</li>
    </ul>
    <h2>Storage</h2>
    <p class="small">Everything stays in this browser's localStorage for this address. Use the same phone, browser and URL for the whole trial, and export the log at the end.</p>
    <details><summary>Reset all data</summary>
      <p class="small">This deletes every grade on this device. Export first.</p>
      <button class="again" id="reset">Delete all prototype data</button></details>`;
  $("#reset").onclick = () => { if (confirm("Delete all prototype data on this device?")) { localStorage.removeItem(KEY); location.reload(); } };
}

document.querySelectorAll("nav.tabs button").forEach((b) => b.onclick = () => { view = b.dataset.view; render(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
render();
</script>
</body>
</html>
