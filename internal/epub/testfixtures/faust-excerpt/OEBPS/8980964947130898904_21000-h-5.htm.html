<title>Faust.</title>
</head>
<body>
<p class="speaker">Mephistopheles <span class="sd">mit der Alten.</span></p>
<p class="indent">Einst hatt’ ich einen wüsten Traum;<br/>
Da sah’ ich einen gespaltnen Baum,<br/>
Der hatt’ ein <ins class="correction" title="Transcriber's note: newer editions read 'ungeheures Loch'">— — —</ins><br/>
So <ins class="correction" title="Transcriber's note: newer editions read 'groß'">—</ins> es war, gefiel mir’s doch.</p>
<p class="speaker">Die Alte.</p>
<p class="indent">Ich biete meinen besten Gruß<br/>
Dem Ritter mit dem Pferdefuß!<br/>
<span class="x-ebookmaker-pageno" title="[274]" id="pgepubid00292"><a id="Page_274" title="[274]"></a></span>Halt’ er einen <ins class="correction" title="Transcriber's note: newer editions read 'rechten Pfropf'">— —</ins> bereit,<br/>
Wenn er <ins class="correction" title="Transcriber's note: newer editions read 'das große Loch'">— — —</ins> nicht scheut.</p>
</body>
