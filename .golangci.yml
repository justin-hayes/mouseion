version: "2"

linters:
  default: none
  enable:
    # Correctness and error handling.
    - govet # compiler-adjacent bug checks (printf args, copied locks, struct tags)
    - staticcheck # bugs, simplifications, and style; settings below
    - errcheck # unchecked errors, including blank assignments
    - errorlint # wrapped-error comparisons use errors.Is/As
    - nilerr # returning nil after checking a non-nil error
    - nilnesserr # returning a different, nil error after an err check
    - nilnil # (nil, nil) returns that hide "not found"
    - errname # sentinel and error type naming
    - errchkjson # unchecked or unnecessary json.Marshal errors
    - ineffassign # assignments that are never read
    - wastedassign # assignments overwritten before use
    - unused # dead code
    - unparam # parameters and results that are always the same value
    - unconvert # redundant type conversions
    - forcetypeassert # unchecked type assertions that would panic
    - exhaustive # switches over enums handle every value or default
    - gochecksumtype # switches over sealed sum types handle every variant
    - durationcheck # multiplying two time.Durations
    - makezero # append to a slice created with non-zero length
    - copyloopvar # redundant pre-Go 1.22 loop variable copies
    - reassign # reassigning package variables of other packages
    - predeclared # shadowing predeclared identifiers
    - recvcheck # mixed value and pointer receivers
    - gocritic # likely-bug diagnostics only; settings below
    # Resources, I/O, and data access.
    - bodyclose # HTTP response bodies are closed
    - sqlclosecheck # sql rows and statements are closed
    - rowserrcheck # rows.Err is checked after iteration
    - noctx # HTTP requests and SQL calls carry a context
    - musttag # structs passed to encoders have field tags
    - protogetter # protobuf fields are read through nil-safe getters
    - canonicalheader # HTTP header keys are canonical
    - usestdlibvars # stdlib constants instead of literal methods and codes
    - sloglint # consistent slog key-value usage
    - gosec # security issues
    # Complexity and maintainability.
    - gocognit # cognitive complexity cap; threshold below
    - nakedret # naked returns in long functions
    - dupl # duplicated blocks
    - interfacebloat # interfaces with too many methods
    - modernize # replace outdated idioms with current stdlib equivalents
    - intrange # integer range loops where they fit
    - perfsprint # cheaper alternatives to fmt.Sprintf
    # Tests.
    - testifylint # testify assertion correctness and consistent style
    - thelper # test helpers call t.Helper and name testing parameters consistently
    - usetesting # t.Context, t.TempDir, and t.Setenv over manual setup
    # Comments, spelling, and directives.
    - godot # comments end in a period
    - misspell # common English misspellings
    - nolintlint # nolint comments are specific, explained, and still needed
    - gocheckcompilerdirectives # malformed //go: directives
    # Zero-finding guards (#1815): these report nothing today, so they stay on
    # to block the defects they catch from being reintroduced.
    - bidichk # bidirectional Unicode control characters in source
    - asasalint # []any passed as a single variadic any argument
    - fatcontext # contexts nested inside loops
    - nosprintfhostport # host:port built with Sprintf instead of JoinHostPort
    - exptostd # golang.org/x/exp helpers that the stdlib now provides
    - loggercheck # odd key-value pairs in structured logging calls
    - gochecknoinits # init functions
    - goprintffuncname # printf-like wrappers end in f
    - unqueryvet # SELECT * in SQL strings
    - iotamixing # iota mixed with explicit values in one const block
    - tparallel # inconsistent t.Parallel use in tests and subtests

  # Evaluated and rejected; do not re-add without revisiting the reason here:
  # - contextcheck: false positives on templ-generated code.
  # - wrapcheck, err113, goconst, inamedparam, revive: high volume, mostly noise.
  # - paralleltest: no test uses t.Parallel, so it has nothing to check.
  # - dupword: false positives on German test data.

  settings:
    gocognit:
      min-complexity: 70
    gocritic:
      # Only likely-bug checks; style and performance checks stay off. A
      # disabled tag overrides an enabled one, so experimental and opinionated
      # are not disabled here: that would also drop the diagnostic checks that
      # carry those tags (deferInLoop, badLock, uncheckedInlineErr, sqlQuery, ...).
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
        - performance
    interfacebloat:
      max: 10
    exhaustive:
      # An explicit default: is how unknown upstream states (River JobState,
      # OpenAI Batch status) are handled, so it counts as exhaustive.
      default-signifies-exhaustive: true
    errcheck:
      check-blank: true
      check-type-assertions: true
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - all
        # Package comments add little for internal packages.
        - -ST1000
        # ST1005 (lowercase, unpunctuated error strings) is excluded for two
        # reasons: many messages start with a proper noun ("River did not
        # return ...", "German vocabulary backfill ..."), which the check cannot
        # tell apart from sentence case, and the lemma review errors double as
        # learner-facing copy that the webapp renders as written. #1830 removes
        # both causes and enables it.
        - -ST1005
    testifylint:
      # Every checker is on (#1814), so assertions follow one style and failures
      # print actual values. No checker is disabled.
      enable-all: true

  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - gocognit
      # Store contract Run bodies are scenarios, not helpers: the harness runner
      # calls them directly, so t.Helper() would report failures at the runner
      # line instead of the scenario assertion. Matched by the exact signature
      # so real helpers in this package are still checked.
      - path: internal/storecontract/
        linters:
          - thelper
        source: 'Run: func\(t \*testing\.T, h Harness\) \{'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  build-tags:
    - integration
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
