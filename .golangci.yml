version: "2"

linters:
  default: none
  enable:
    - govet
    - bodyclose
    - durationcheck
    - nilnesserr
    - sqlclosecheck
    - gocheckcompilerdirectives
    - nolintlint
    - errorlint
    - nilerr
    - nilnil
    - rowserrcheck
    - wastedassign
    - errcheck
    - unused
    - ineffassign
    - gosec
    - staticcheck
    - exhaustive
    - musttag
    - canonicalheader
    - recvcheck
    - noctx
    - dupl
    - interfacebloat
    - gocognit
    - testifylint
    - modernize
    - intrange
    - unconvert
    - predeclared
    - perfsprint
    - usestdlibvars
    - errname
    - godot
    - misspell
    - makezero
    - reassign
    - sloglint
    - protogetter
    - copyloopvar
    - gochecksumtype
    - errchkjson
    - nakedret
    - usetesting
    - forcetypeassert
    - gocritic
    # Zero-finding guards (#1815): these report nothing today, so they stay on
    # to block the defects they catch from being reintroduced.
    - bidichk
    - asasalint
    - fatcontext
    - nosprintfhostport
    - exptostd
    - loggercheck
    - gochecknoinits
    - goprintffuncname
    - unqueryvet
    - iotamixing
    - tparallel

  # Evaluated and rejected; do not re-add without revisiting the reason here:
  # - contextcheck: false positives on templ-generated code.
  # - wrapcheck, err113, goconst, inamedparam, revive: high volume, mostly noise.
  # - paralleltest: no test uses t.Parallel, so it has nothing to check.
  # - dupword: false positives on German test data.

  settings:
    gocognit:
      min-complexity: 70
    gocritic:
      # Only likely-bug checks; style, performance, experimental, and
      # opinionated checks stay off.
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
        - performance
        - experimental
        - opinionated
    interfacebloat:
      max: 10
    exhaustive:
      # An explicit default: is how unknown upstream states (River JobState,
      # OpenAI Batch status) are handled, so it counts as exhaustive.
      default-signifies-exhaustive: true
    errcheck:
      check-blank: true
      check-type-assertions: true
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        - SA*
    testifylint:
      disable-all: true
      enable:
        - error-nil
        - require-error

  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - gocognit

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  build-tags:
    - integration
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
