# Mouseion home-lab stack: PostgreSQL + Python NLP (Stanza) gRPC service + Go web server.
#
# Bring up the whole app with:
#   docker compose up -d
# Then open http://<tailscale-host>:8080 and sign in with an existing account.
#
# Per ADR 0009 the app is intended to be reachable ONLY over your tailnet
# (plain HTTP over WireGuard). Do not expose :8080 to the public internet.
name: mouseion

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mouseion
      POSTGRES_PASSWORD: ${MOUSEION_DB_PASSWORD:-mouseion}
      POSTGRES_DB: mouseion
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mouseion -d mouseion"]
      interval: 5s
      timeout: 3s
      retries: 10

  nlp-init:
    build:
      context: .
      dockerfile: nlp/Dockerfile
    entrypoint: ["python", "-m", "mouseion_nlp.provision"]
    environment:
      MOUSEION_NLP_WARM_LANGUAGES: ${MOUSEION_NLP_WARM_LANGUAGES:-de,it}
      STANZA_RESOURCES_DIR: /opt/stanza_resources
    volumes:
      - stanza-data:/opt/stanza_resources

  nlp:
    build:
      context: .
      dockerfile: nlp/Dockerfile
    restart: unless-stopped
    # The init service populates this shared volume before NLP can start.
    depends_on:
      nlp-init:
        condition: service_completed_successfully
    environment:
      MOUSEION_NLP_ADDR: "[::]:50051"
      MOUSEION_NLP_WARM_LANGUAGES: ${MOUSEION_NLP_WARM_LANGUAGES:-de,it}
      STANZA_RESOURCES_DIR: /opt/stanza_resources
    volumes:
      - stanza-data:/opt/stanza_resources
    expose:
      - "50051"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      nlp:
        condition: service_started
    environment:
      MOUSEION_DATABASE_URL: postgres://mouseion:${MOUSEION_DB_PASSWORD:-mouseion}@db:5432/mouseion?sslmode=disable
      MOUSEION_NLP_ADDR: nlp:50051
      MOUSEION_HTTP_ADDR: ":8080"
      # Set to "true" only when serving HTTPS (e.g. tailscale cert / TLS reverse proxy); ADR 0009.
      MOUSEION_COOKIE_SECURE: ${MOUSEION_COOKIE_SECURE:-false}
      MOUSEION_DICTIONARY_INDEX: ${MOUSEION_DICTIONARY_INDEX:-/opt/mouseion/dictionary/dictionary-index.sqlite}
      MOUSEION_SECRET: ${MOUSEION_SECRET:-change-me-in-prod}
      MOUSEION_LLM_ENABLED: ${MOUSEION_LLM_ENABLED:-false}
      MOUSEION_LLM_API_KEY: ${MOUSEION_LLM_API_KEY:-}
      MOUSEION_LLM_MODEL: ${MOUSEION_LLM_MODEL:-}
      # Standard prepared-deck translation uses this compatible endpoint;
      # explicit Batch mode requires the official OpenAI API base URL.
      MOUSEION_LLM_BASE_URL: ${MOUSEION_LLM_BASE_URL:-https://api.openai.com/v1}
      MOUSEION_LLM_TIMEOUT: ${MOUSEION_LLM_TIMEOUT:-30s}
      MOUSEION_LLM_REASONING_EFFORT: ${MOUSEION_LLM_REASONING_EFFORT:-low}
      MOUSEION_LLM_SUPPORTS_REASONING_EFFORT: ${MOUSEION_LLM_SUPPORTS_REASONING_EFFORT:-false}
      MOUSEION_PREPARED_DECK_TRANSLATION_MODE: ${MOUSEION_PREPARED_DECK_TRANSLATION_MODE:-standard}
      MOUSEION_PREPARED_DECK_STANDARD_MAX_CONCURRENCY: ${MOUSEION_PREPARED_DECK_STANDARD_MAX_CONCURRENCY:-4}
      MOUSEION_PREPARED_DECK_STANDARD_MAX_ATTEMPTS: ${MOUSEION_PREPARED_DECK_STANDARD_MAX_ATTEMPTS:-3}
      MOUSEION_PREPARED_DECK_STANDARD_RETRY_BASE_DELAY: ${MOUSEION_PREPARED_DECK_STANDARD_RETRY_BASE_DELAY:-1s}
      MOUSEION_PREPARED_DECK_STANDARD_RETRY_MAX_DELAY: ${MOUSEION_PREPARED_DECK_STANDARD_RETRY_MAX_DELAY:-30s}
      MOUSEION_PREPARED_DECK_BATCH_MAX_REQUESTS: ${MOUSEION_PREPARED_DECK_BATCH_MAX_REQUESTS:-5000}
      MOUSEION_PREPARED_DECK_BATCH_POLL_INTERVAL: ${MOUSEION_PREPARED_DECK_BATCH_POLL_INTERVAL:-30s}
    volumes:
      - ${MOUSEION_DICTIONARY_HOST_DIR:-./dictionary}:/opt/mouseion/dictionary:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/mouseion-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  stanza-data:
