syntax = "proto3";

package mouseion.v1;

option go_package = "github.com/justin-hayes/mouseion/gen/go/mouseion/v1;mouseionv1";

service AnalyzerService {
  rpc Analyze(AnalyzeRequest) returns (NormalizedCorpus);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  repeated LanguageCapability languages = 1;
}

message LanguageCapability {
  string language = 1;
  string display_name = 2;
  string model_version = 3;
  repeated string supported_features = 4;
  bool ready = 5;
}

// AnalyzeRequest carries one complete source document across the analyzer RPC
// boundary. Request fields use the 100-series block to remain distinct from
// the persisted corpus messages below.
message AnalyzeRequest {
  string language = 101;
  string document_text = 102;
  SourceDocument source_document = 103;
}

// NormalizedCorpus is the single contract used both for analysis messages at
// the Go/Python boundary and for persisted normalized-corpus artifacts.
//
// schema_version uses semantic versions (for example, "1.0.0"). Consumers
// must reject unsupported major versions. Minor and patch releases are
// backward-compatible, additive changes. Once released, field numbers are
// frozen and must never be reused; incompatible changes require a new major
// schema version and an explicit artifact migration.
message NormalizedCorpus {
  string schema_version = 1;
  // language is an ISO 639 language code, optionally with a BCP 47 region.
  string language = 2;
  // Sentences are stored in source order.
  repeated Sentence sentences = 3;
  repeated SourceDocument source_documents = 4;
  AnalysisProvenance analysis = 5;
  NormalizationProfile normalization_profile = 6;
}

message Sentence {
  string text = 1;
  // Tokens are stored in sentence order.
  repeated Token tokens = 2;
  SourceLocation location = 3;
}

message Token {
  // surface is the lexical form with surrounding Unicode punctuation/symbols
  // removed; sentence text and source offsets preserve the analyzer input.
  string surface = 1;
  // raw_lemma is preserved exactly as returned by the analyzer.
  string raw_lemma = 2;
  // pos is the analyzer's coarse Universal POS (UPOS) tag.
  string pos = 3;
  // canonical_lemma is derived using NormalizedCorpus.normalization_profile.
  string canonical_lemma = 4;
  map<string, string> morphology = 5;
  optional string named_entity = 6;
  SourceLocation location = 7;
}

message SourceDocument {
  // id is stable within the corpus and is referenced by SourceLocation.
  string id = 1;
  // source_identifier is the upstream identifier, such as an OPDS entry ID.
  string source_identifier = 2;
  string title = 3;
}

message AnalysisProvenance {
  string run_id = 1;
  // analyzed_at is an RFC 3339 timestamp in UTC.
  string analyzed_at = 2;
  string analyzer_name = 3;
  string analyzer_version = 4;
}

message NormalizationProfile {
  string name = 1;
  string version = 2;
}

// SourceLocation identifies a reproducible half-open span [start_offset,
// end_offset) in Unicode code points within the source document's extracted
// text. chapter and section retain human-readable structural provenance.
message SourceLocation {
  string source_document_id = 1;
  string chapter = 2;
  string section = 3;
  uint64 start_offset = 4;
  uint64 end_offset = 5;
}
