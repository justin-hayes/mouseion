version: 2

# Dependency-update conventions shared by every ecosystem below; the policy is
# documented in doc/development.md ("Dependency updates").
#
# - schedule: weekly on one fixed day and time (Berlin time), so update pull requests arrive
#   together and can be reviewed in one sitting.
# - groups: minor and patch updates share one pull request per ecosystem; major
#   updates are left ungrouped so each breaking change gets its own review.
# - open-pull-requests-limit: caps open version-update pull requests per
#   ecosystem.
# - commit-message prefix: Conventional Commits, `ci(deps)` for GitHub Actions
#   and `build(deps)` for application dependencies.
#
# update-types restricts version updates only; security updates are created
# regardless. See the policy for how ignore rules apply to security updates.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # github.com/a-h/templ: the module must match the templ CLI that `make templ`
      # and the Dockerfile run, and newer templ requires Go 1.25 or later. The CLI
      # is not in a file Dependabot reads, so both pins move by hand with this
      # module. Lift by bumping them together (doc/development.md, Dependency updates).
      - dependency-name: "github.com/a-h/templ"
      # google.golang.org/protobuf: kept equal to the protoc-gen-go version that CI
      # installs, so the runtime and the generator that verify gen/go and gen/python
      # move together. Lift by bumping them together (doc/development.md, Dependency updates).
      - dependency-name: "google.golang.org/protobuf"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # golang: the Go toolchain is set by the go directive in go.mod, which CI reads
      # through go-version-file. Dependabot cannot ignore updates that raise the go
      # directive, so this rule keeps the Dockerfile image from moving past the 1.27
      # line on its own. Raising Go is a manual change (doc/development.md, Dependency updates).
      - dependency-name: "golang"
        versions:
          - ">= 1.28"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      docker-compose-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /nlp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
