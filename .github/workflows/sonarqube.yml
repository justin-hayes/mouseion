name: SonarQube Cloud

# Analyses every push to main and every pull request. It does not use the
# change classifier in ci.yml: static analysis and coverage are cheap, and the
# analysis history must not have gaps.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  # Only pull requests supersede older runs; main keeps every analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Read-only: lets the scanner read pull-request details for decoration.
      pull-requests: read
    env:
      # Fork pull requests get no repository secrets, so the scan is skipped
      # there. The coverage steps still run, so the job still succeeds.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      # SonarQube Cloud needs full history to resolve pull-request base and
      # new-code periods.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test coverage filter behavior
        run: tools/coverage-filter_test.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templ views
        run: |
          make templ-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          PATH="$(go env GOPATH)/bin:$PATH" make templ

      # make coverage runs the NLP tests, so it needs the same Python environment
      # as ci.yml. Its preflight fails fast when this environment is missing.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: nlp/requirements-dev.txt

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Create Python environment
        run: uv venv --python 3.13 .venv

      # Installs are binary-only and pinned. The NLP package is not installed
      # from source: the tests import it from PYTHONPATH (nlp/src, set by
      # make coverage). Its runtime dependencies are pinned in the dev requirements.
      - name: Install Python dev dependencies
        run: |
          uv pip install --python .venv/bin/python \
            --disable-pip-version-check \
            --only-binary :all: \
            -r nlp/requirements-dev.txt

      # Install CPU-only Torch explicitly, as in ci.yml. Pinned to the version in
      # the CPU index that the NLP service resolves.
      - name: Install CPU-only PyTorch
        run: |
          uv pip install --python .venv/bin/python \
            --disable-pip-version-check \
            --only-binary :all: \
            torch==2.14.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Go and Python coverage
        run: make coverage

      # Lint reports are inputs to SonarQube Cloud only. Enforcement stays with
      # the lint jobs in ci.yml, so findings must not fail this workflow. The
      # golangci-lint version matches the one pinned in ci.yml.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      # The reports are written in the formats Sonar imports: golangci-lint
      # checkstyle XML and Ruff JSON. A missing or empty report fails the step,
      # so a broken lint run stays visible.
      - name: Lint reports for SonarQube Cloud
        run: |
          mkdir -p .tmp/lint
          golangci-lint run --output.checkstyle.path=.tmp/lint/golangci-lint-report.xml ./... || true
          test -s .tmp/lint/golangci-lint-report.xml
          .venv/bin/ruff check --output-format json nlp/src nlp/tests > .tmp/lint/ruff-report.json || true
          test -s .tmp/lint/ruff-report.json

      - name: SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
