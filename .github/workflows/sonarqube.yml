name: SonarQube Cloud

# Analyses every push to main and every pull request. It does not use the
# change classifier in ci.yml: static analysis and coverage are cheap, and the
# analysis history must not have gaps.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sonarqube-${{ github.workflow }}-${{ github.ref }}
  # Only pull requests supersede older runs; main keeps every analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Read-only: lets the scanner read pull-request details for decoration.
      pull-requests: read
    env:
      # Fork pull requests get no repository secrets, so the scan is skipped
      # there. The coverage steps still run, so the job still succeeds.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      # SonarQube Cloud needs full history to resolve pull-request base and
      # new-code periods.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test coverage filter behavior
        run: tools/coverage-filter_test.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # make coverage runs the NLP tests, so it needs the same Python environment
      # as ci.yml. Its preflight fails fast when this environment is missing.
      # uv is pinned to the version ci.yml and the Makefile use (ADR 0089).
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: nlp/uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      # Installs only from nlp/uv.lock, the same locked, binary-only environment
      # as ci.yml. The NLP package is never installed: the tests import it from
      # PYTHONPATH (nlp/src, set by make coverage).
      - name: Install Python dependencies
        run: |
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.venv" uv sync \
            --project nlp \
            --python 3.13 \
            --locked \
            --no-build \
            --group dev

      - name: Go and Python coverage
        run: make coverage

      # Lint reports are inputs to SonarQube Cloud only. Enforcement stays with
      # the lint jobs in ci.yml, so findings must not fail this workflow. The
      # golangci-lint action installs the same pinned version as ci.yml, with a
      # checksum-verified binary.
      - name: Create lint report directory
        run: mkdir -p .tmp/lint

      - name: golangci-lint report for SonarQube Cloud
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        continue-on-error: true
        with:
          version: v2.14.0
          args: --output.checkstyle.path=.tmp/lint/golangci-lint-report.xml

      # The reports are written in the formats Sonar imports: golangci-lint
      # checkstyle XML and Ruff JSON. A missing or empty report fails the step,
      # so a broken lint run stays visible.
      - name: Ruff report for SonarQube Cloud
        run: |
          .venv/bin/ruff check --output-format json nlp/src nlp/tests > .tmp/lint/ruff-report.json || true
          test -s .tmp/lint/ruff-report.json
          test -s .tmp/lint/golangci-lint-report.xml

      - name: SonarQube Cloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
