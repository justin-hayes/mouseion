name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Determine which parts of the repository are affected.
      #
      # On workflow_dispatch, run every check so the manual action can be
      # used as a complete CI verification.
      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'proto/**'
              - 'gen/go/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

            python:
              - 'nlp/**'
              - 'gen/python/**'
              - 'proto/**'
              - 'Makefile'
              - 'pyproject.toml'
              - 'nlp/requirements-dev.txt'
              - '.github/workflows/ci.yml'

            generated:
              - 'proto/**'
              - 'Makefile'
              - 'go.mod'
              - 'nlp/requirements-dev.txt'
              - '.github/workflows/ci.yml'

      # ------------------------------------------------------------------
      # Go
      # ------------------------------------------------------------------

      - name: Set up Go
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true' ||
          steps.changes.outputs.generated == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go build
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true'
        run: go build ./...

      - name: Go test
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true'
        run: go test ./...

      - name: Go vet
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true'
        run: go vet ./...

      # ------------------------------------------------------------------
      # Python
      # ------------------------------------------------------------------

      - name: Set up Python
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nlp/requirements-dev.txt

      - name: Set up Python environment
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        run: make setup

      - name: Python build
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        run: >
          PYTHONPATH=nlp/src:gen/python
          .venv/bin/python -m compileall -q nlp/src gen/python

      - name: Python test
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        run: >
          PYTHONPATH=nlp/src:gen/python
          .venv/bin/pytest -q nlp/tests

      - name: Python lint
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        run: .venv/bin/ruff check nlp/src nlp/tests

      # ------------------------------------------------------------------
      # Generated protobuf code
      # ------------------------------------------------------------------

      - name: Set up protoc
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.generated == 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: '29.3'

      - name: Install protoc-gen-go
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.generated == 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf code
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.generated == 'true'
        run: make gen

      - name: Verify generated code is current
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.generated == 'true'
        run: git diff --exit-code
