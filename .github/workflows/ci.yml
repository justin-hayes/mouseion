name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# The changes job classifies the pull request once (tools/ci-changes.sh); every
# gated job reads that result. A gated job still runs when classification did
# not succeed, and its first step fails, so a broken classification can skip
# nothing. Cancelled runs are never reported as success.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.classify.outputs.build }}
      go: ${{ steps.classify.outputs.go }}
      python: ${{ steps.classify.outputs.python }}
      generated: ${{ steps.classify.outputs.generated }}
      frontend: ${{ steps.classify.outputs.frontend }}
      browser: ${{ steps.classify.outputs.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's base and head commits must be present to diff them.
          fetch-depth: 0

      - name: Test change classification
        run: tools/ci-changes_test.sh

      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
            tools/ci-changes.sh < "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"
          else
            tools/ci-changes.sh --all >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Build and test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Fail when change detection failed
        if: needs.changes.result != 'success'
        run: exit 1

      # ------------------------------------------------------------------
      # Checkout and frontend
      # ------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify generated frontend stylesheets
        if: needs.changes.outputs.frontend == 'true'
        run: make check-frontend-css

      # ------------------------------------------------------------------
      # Go
      # ------------------------------------------------------------------

      - name: Set up Go
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.generated == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # make sqlc and make gen build through templ, so generated changes need it too.
      - name: Generate templ views
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.generated == 'true'
        run: |
          make templ-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          PATH="$(go env GOPATH)/bin:$PATH" make templ

      - name: Go build
        if: needs.changes.outputs.go == 'true'
        run: go build ./...

      - name: Go test
        if: needs.changes.outputs.go == 'true'
        run: go test ./...

      # ------------------------------------------------------------------
      # Python
      # ------------------------------------------------------------------

      - name: Set up uv
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.generated == 'true'
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
          cache-dependency-glob: nlp/requirements-dev.txt

      - name: Set up Python 3.13
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.generated == 'true'
        run: uv python install 3.13

      - name: Create Python environment
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.generated == 'true'
        run: uv venv --python 3.13 .venv

      # Generation runs grpcio-tools from these requirements, so generated changes need them too.
      - name: Install Python dev dependencies
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.generated == 'true'
        run: |
          uv pip install --python .venv/bin/python \
            --disable-pip-version-check \
            -r nlp/requirements-dev.txt

      # Install CPU-only Torch explicitly before installing Mouseion.
      # This prevents Stanza from pulling in the much larger CUDA-enabled
      # Linux dependency stack on CI runners.
      - name: Install CPU-only PyTorch
        if: needs.changes.outputs.python == 'true'
        run: |
          uv pip install --python .venv/bin/python \
            --disable-pip-version-check \
            torch \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Mouseion NLP
        if: needs.changes.outputs.python == 'true'
        run: |
          uv pip install --python .venv/bin/python \
            --disable-pip-version-check \
            -e nlp

      - name: Python build
        if: needs.changes.outputs.python == 'true'
        run: >
          PYTHONPATH=nlp/src:gen/python
          .venv/bin/python -m compileall -q nlp/src gen/python

      - name: Python test
        if: needs.changes.outputs.python == 'true'
        run: >
          PYTHONPATH=nlp/src:gen/python
          .venv/bin/pytest -q nlp/tests

      - name: Python lint
        if: needs.changes.outputs.python == 'true'
        run: .venv/bin/ruff check nlp/src nlp/tests

      # ------------------------------------------------------------------
      # Generated protobuf and sqlc code
      # ------------------------------------------------------------------

      - name: Set up protoc
        if: needs.changes.outputs.generated == 'true'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0; latest release uses Node 20, no Node 24 release available
        with:
          version: '29.3'

      - name: Install protoc-gen-go
        if: needs.changes.outputs.generated == 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf code
        if: needs.changes.outputs.generated == 'true'
        run: make gen

      - name: Set up sqlc
        if: needs.changes.outputs.generated == 'true'
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: '1.31.1'

      - name: Generate sqlc code
        if: needs.changes.outputs.generated == 'true'
        run: make sqlc

      - name: Verify generated code is current
        if: needs.changes.outputs.generated == 'true'
        run: git diff --exit-code

  golangci:
    name: Go lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Fail when change detection failed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templ views
        run: |
          make templ-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          PATH="$(go env GOPATH)/bin:$PATH" make templ

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  integration:
    name: Integration tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Fail when change detection failed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templ views
        run: |
          make templ-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          PATH="$(go env GOPATH)/bin:$PATH" make templ

      # Every package with integration tests runs; each test gets its own
      # database cloned from a migrated template, so packages run in parallel.
      - name: Go integration test
        run: make test-integration

  # Builds the commit-matched fixture server once per run attempt for the browser
  # shards. It needs only the checkout, so shards never wait for the Go, Python,
  # lint, or integration jobs, and it does no work unless browser checks are required.
  browser-fixture:
    name: Browser fixture
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Fail when change detection failed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The name binds the artifact to this commit and this run attempt, so a
      # shard can never download a binary from another commit, an older attempt,
      # or an overlapping workflow run.
      - name: Name browser fixture artifact
        id: artifact
        run: echo "name=browser-fixture-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templ views
        run: |
          make templ-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          PATH="$(go env GOPATH)/bin:$PATH" make templ

      # Artifact upload does not preserve the executable bit, so shards restore
      # it. The commit and platform files let shards reject a mismatched binary.
      - name: Build fixture server
        run: |
          mkdir -p .tmp/browser-fixture
          go build -o .tmp/browser-fixture/fixtureserver ./cmd/fixtureserver
          printf '%s\n' "$GITHUB_SHA" > .tmp/browser-fixture/commit
          uname -sm > .tmp/browser-fixture/platform

      - name: Upload browser fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .tmp/browser-fixture/
          if-no-files-found: error
          retention-days: 1

  browser-smoke-shard:
    name: Browser smoke shard ${{ matrix.shard }}/4
    needs: [changes, browser-fixture]
    # Skipped when browser checks are not required; a failed fixture build or
    # change detection also skips the shards, and tools/ci-gate.sh fails on that.
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Official Playwright image: Chromium, WebKit, and their Linux runtime
      # libraries. Pinned by digest. Its tag must match @playwright/test in
      # e2e/package-lock.json (checked below), so bump both together; see
      # e2e/README.md "Dependency and update policy".
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Restore the commit-matched fixture before any browser setup, so a bad
      # artifact fails fast. An unset artifact name or a failed download fails
      # the step rather than falling back to building locally.
      - name: Download browser fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.browser-fixture.outputs.artifact }}
          path: .tmp/browser-fixture
      - name: Verify browser fixture
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(cat .tmp/browser-fixture/commit)" = "$EXPECTED_SHA"
          test "$(cat .tmp/browser-fixture/platform)" = "$(uname -sm)"
          chmod 0755 .tmp/browser-fixture/fixtureserver
          test -x .tmp/browser-fixture/fixtureserver

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright dependency
        working-directory: e2e
        run: npm ci --ignore-scripts
      - name: Verify Playwright image matches locked version
        run: |
          locked=$(node -p "require('./e2e/package-lock.json').packages['node_modules/@playwright/test'].version")
          case "$PLAYWRIGHT_IMAGE" in
            *":v${locked}-"*) echo "Playwright image matches locked @playwright/test $locked" ;;
            *)
              echo "::error::PLAYWRIGHT_IMAGE must be tagged v${locked}-* to match e2e/package-lock.json" >&2
              exit 1
              ;;
          esac
      # Runs in the pinned image, so no APT or browser download happens here.
      # --network=host reaches the loopback fixture server; --ipc=host gives
      # Chromium the shared memory it needs; --init reaps child processes. Files
      # are written as the runner user so the failure-artifact upload works.
      - name: Run browser smoke
        env:
          CI: true
        run: |
          docker run --rm --init --ipc=host --network=host \
            --user "$(id -u):$(id -g)" \
            -e CI -e HOME=/tmp \
            -e MOUSEION_FIXTURE_BIN=/work/.tmp/browser-fixture/fixtureserver \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/e2e \
            "$PLAYWRIGHT_IMAGE" \
            npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  # The required status check is named "Browser smoke". It passes only when the
  # shards succeeded because browser checks were required, or were skipped
  # because they were not; tools/ci-gate.sh holds the rule.
  browser-smoke:
    name: Browser smoke
    needs: [changes, browser-smoke-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the browser outcome the changes call for
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser }}
          SHARDS_RESULT: ${{ needs.browser-smoke-shard.result }}
        run: tools/ci-gate.sh "$CHANGES_RESULT" "$BROWSER_REQUIRED" "$SHARDS_RESULT"
