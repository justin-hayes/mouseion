name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  change-scope:
    name: Determine change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          docs_only=true

          if [ -z "$files" ]; then
            # Unknown or empty diff: run CI conservatively.
            docs_only=false
          else
            while IFS= read -r path; do
              case "$path" in
                doc/*|*.md)
                  # AGENTS.md is repository policy, not ordinary documentation.
                  if [ "$path" = "AGENTS.md" ]; then
                    docs_only=false
                  fi
                  ;;
                *)
                  docs_only=false
                  ;;
              esac
            done <<< "$files"
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  go:
    name: Go build and test
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...

  python:
    name: Python build and test
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nlp/requirements-dev.txt

      - run: make setup

      - name: Build
        run: PYTHONPATH=nlp/src:gen/python .venv/bin/python -m compileall -q nlp/src gen/python

      - name: Test
        run: PYTHONPATH=nlp/src:gen/python .venv/bin/pytest -q nlp/tests

      - name: Lint
        run: .venv/bin/ruff check nlp/src nlp/tests

  generated:
    name: Protobuf generated code
    needs: change-scope
    if: needs.change-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          version: '29.3'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make gen
      - run: git diff --exit-code
