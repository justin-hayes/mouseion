name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No workflow-level grants: each job declares only what it uses.
permissions: {}

# The changes job classifies the pull request once (tools/ci-changes.sh); every
# gated job reads that result. A gated job still runs when classification did
# not succeed, and its first step fails, so a broken classification can skip
# nothing. Cancelled runs are never reported as success.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.classify.outputs.build }}
      go: ${{ steps.classify.outputs.go }}
      python: ${{ steps.classify.outputs.python }}
      generated: ${{ steps.classify.outputs.generated }}
      frontend: ${{ steps.classify.outputs.frontend }}
      browser: ${{ steps.classify.outputs.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's base and head commits must be present to diff them.
          fetch-depth: 0

      - name: Test change classification
        run: tools/ci-changes_test.sh

      - name: Classify changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
            tools/ci-changes.sh < "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"
          else
            tools/ci-changes.sh --all >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Build and test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Fail when change detection failed
        if: needs.changes.result != 'success'
        run: exit 1

      # ------------------------------------------------------------------
      # Checkout and frontend
      # ------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify generated frontend stylesheets
        if: needs.changes.outputs.frontend == 'true'
        run: make check-frontend-css

      # ------------------------------------------------------------------
      # Go
      # ------------------------------------------------------------------

      - name: Set up Go
        if: needs.changes.outputs.go == 'true' || needs.changes.outputs.generated == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Go build
        if: needs.changes.outputs.go == 'true'
        run: go build ./...

      # go.mod and Dockerfile changes both mark the go class.
      - name: Verify Dockerfile Go image satisfies go.mod
        if: needs.changes.outputs.go == 'true'
        run: make check-dockerfile-go

      # The unit suite runs under the race detector through the same Makefile
      # switch developers use locally (doc/development.md).
      - name: Go test
        if: needs.changes.outputs.go == 'true'
        run: make test-go RACE=1

      # ------------------------------------------------------------------
      # Python
      # ------------------------------------------------------------------

      # uv is pinned to the version the Makefile and the NLP image use (ADR 0089).
      - name: Set up uv
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.generated == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.0'
          enable-cache: true
          cache-dependency-glob: nlp/uv.lock

      - name: Set up Python 3.13
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.generated == 'true'
        run: uv python install 3.13

      # Fails when nlp/pyproject.toml and nlp/uv.lock disagree; run `uv lock` to fix.
      - name: Check Python lock
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.generated == 'true'
        run: uv lock --project nlp --check

      # Installs only from the lock: binary-only, CPU-only torch from its explicit
      # index, and the NLP project is never built. Generation runs grpcio-tools
      # from the dev group, so generated changes need it too. The environment path
      # must be absolute: uv resolves a relative UV_PROJECT_ENVIRONMENT from nlp/.
      - name: Install Python dependencies
        if: needs.changes.outputs.python == 'true' || needs.changes.outputs.generated == 'true'
        run: |
          UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.venv" uv sync \
            --project nlp \
            --python 3.13 \
            --locked \
            --no-build \
            --group dev

      - name: Python build
        if: needs.changes.outputs.python == 'true'
        run: >
          PYTHONPATH=nlp/src:gen/python
          .venv/bin/python -m compileall -q nlp/src gen/python

      - name: Python test
        if: needs.changes.outputs.python == 'true'
        run: >
          PYTHONPATH=nlp/src:gen/python
          .venv/bin/pytest -q nlp/tests

      - name: Python lint
        if: needs.changes.outputs.python == 'true'
        run: |
          .venv/bin/ruff check nlp/src nlp/tests nlp/scripts
          .venv/bin/ruff format --check nlp/src nlp/tests nlp/scripts
          .venv/bin/mypy --config-file nlp/pyproject.toml nlp/src

      # ------------------------------------------------------------------
      # Generated templ, protobuf, and sqlc code
      # ------------------------------------------------------------------

      # Unlike the Go-compiling make targets, make templ fails without the
      # pinned templ, so stale committed views cannot pass unnoticed.
      - name: Generate templ views
        if: needs.changes.outputs.generated == 'true'
        run: make templ

      # arduino/setup-protoc stays on v3.0.0: its latest release still runs on
      # Node 20 and no Node 24 release exists. Dependabot rewrites the version
      # comment on the uses line, so the reason lives here instead.
      - name: Set up protoc
        if: needs.changes.outputs.generated == 'true'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '29.3'
          # Authenticated release lookups get a far higher GitHub API rate limit
          # than anonymous ones, which shared runner IPs exhaust.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate protobuf code
        if: needs.changes.outputs.generated == 'true'
        run: make gen

      - name: Set up sqlc
        if: needs.changes.outputs.generated == 'true'
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: '1.31.1'

      - name: Generate sqlc code
        if: needs.changes.outputs.generated == 'true'
        run: make sqlc

      - name: Verify generated code is current
        if: needs.changes.outputs.generated == 'true'
        run: git diff --exit-code

  golangci:
    name: Go lint
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Fail when change detection failed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  integration:
    name: Integration tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Fail when change detection failed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Every package with integration tests runs under the race detector,
      # through the same Makefile switch developers use locally
      # (doc/development.md); each test gets its own database cloned from a
      # migrated template, so packages run in parallel.
      - name: Go integration test
        run: make test-integration RACE=1

  govulncheck:
    name: Go vulnerability check
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Fail when change detection failed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # govulncheck is pinned through the tool directive in go.mod, so this
      # uses the same version and result set as a local `make vuln`. It downloads
      # the vulnerability database, so it needs the runner's network.
      - name: Go vulnerability check
        run: make vuln

  # Builds the commit-matched fixture server once per run attempt for the browser
  # shards. It needs only the checkout, so shards never wait for the Go, Python,
  # lint, or integration jobs, and it does no work unless browser checks are required.
  browser-fixture:
    name: Browser fixture
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Fail when change detection failed
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The name binds the artifact to this commit and this run attempt, so a
      # shard can never download a binary from another commit, an older attempt,
      # or an overlapping workflow run.
      - name: Name browser fixture artifact
        id: artifact
        run: echo "name=browser-fixture-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Artifact upload does not preserve the executable bit, so shards restore
      # it. The commit and platform files let shards reject a mismatched binary.
      - name: Build fixture server
        run: |
          mkdir -p .tmp/browser-fixture
          go build -o .tmp/browser-fixture/fixtureserver ./cmd/fixtureserver
          printf '%s\n' "$GITHUB_SHA" > .tmp/browser-fixture/commit
          uname -sm > .tmp/browser-fixture/platform

      - name: Upload browser fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .tmp/browser-fixture/
          if-no-files-found: error
          retention-days: 1

  browser-smoke-shard:
    name: Browser smoke shard ${{ matrix.shard }}/4
    needs: [changes, browser-fixture]
    # Skipped when browser checks are not required; a failed fixture build or
    # change detection also skips the shards, and tools/ci-gate.sh fails on that.
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Official Playwright image: Chromium, WebKit, and their Linux runtime
      # libraries. Pinned by digest. Its tag must match @playwright/test in
      # e2e/package-lock.json (checked below), so bump both together; see
      # e2e/README.md "Dependency and update policy".
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Restore the commit-matched fixture before any browser setup, so a bad
      # artifact fails fast. An unset artifact name or a failed download fails
      # the step rather than falling back to building locally.
      - name: Download browser fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.browser-fixture.outputs.artifact }}
          path: .tmp/browser-fixture
      - name: Verify browser fixture
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(cat .tmp/browser-fixture/commit)" = "$EXPECTED_SHA"
          test "$(cat .tmp/browser-fixture/platform)" = "$(uname -sm)"
          chmod 0755 .tmp/browser-fixture/fixtureserver
          test -x .tmp/browser-fixture/fixtureserver

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright dependency
        working-directory: e2e
        run: npm ci --ignore-scripts
      - name: Verify Playwright image matches locked version
        run: |
          locked=$(node -p "require('./e2e/package-lock.json').packages['node_modules/@playwright/test'].version")
          case "$PLAYWRIGHT_IMAGE" in
            *":v${locked}-"*) echo "Playwright image matches locked @playwright/test $locked" ;;
            *)
              echo "::error::PLAYWRIGHT_IMAGE must be tagged v${locked}-* to match e2e/package-lock.json" >&2
              exit 1
              ;;
          esac
      # Runs in the pinned image, so no APT or browser download happens here.
      # --network=host reaches the loopback fixture server; --ipc=host gives
      # Chromium the shared memory it needs; --init reaps child processes. Files
      # are written as the runner user so the failure-artifact upload works.
      - name: Run browser smoke
        env:
          CI: true
        run: |
          docker run --rm --init --ipc=host --network=host \
            --user "$(id -u):$(id -g)" \
            -e CI -e HOME=/tmp \
            -e MOUSEION_FIXTURE_BIN=/work/.tmp/browser-fixture/fixtureserver \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/e2e \
            "$PLAYWRIGHT_IMAGE" \
            npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-artifacts-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  # The required status check is named "Browser smoke". It passes only when the
  # shards succeeded because browser checks were required, or were skipped
  # because they were not; tools/ci-gate.sh holds the rule.
  browser-smoke:
    name: Browser smoke
    needs: [changes, browser-smoke-shard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the browser outcome the changes call for
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser }}
          SHARDS_RESULT: ${{ needs.browser-smoke-shard.result }}
        run: tools/ci-gate.sh "$CHANGES_RESULT" "$BROWSER_REQUIRED" "$SHARDS_RESULT"
