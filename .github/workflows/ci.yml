name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------------
      # Checkout and change detection
      # ------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed files
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3; latest release uses Node 20, no Node 24 release available
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/*.templ'
              - 'go.mod'
              - 'go.sum'
              - 'proto/**'
              - 'gen/go/**'
              - 'gen/sqlc/**'
              - 'sqlc/**'
              - 'migrations/**'
              - 'Makefile'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'

            python:
              - 'nlp/**'
              - 'gen/python/**'
              - 'proto/**'
              - 'pyproject.toml'
              - 'nlp/requirements-dev.txt'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - 'sqlc/**'
              - 'gen/sqlc/**'
              - 'migrations/**'

            generated:
              - 'proto/**'
              - 'sqlc/**'
              - 'gen/sqlc/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - 'pyproject.toml'
              - 'nlp/requirements-dev.txt'
              - 'Makefile'
              - '.github/workflows/ci.yml'

            frontend:
              - 'internal/webapp/*.templ'
              - 'internal/webapp/components.go'
              - 'internal/webapp/static/app.css'
              - 'internal/webapp/static/my-books.js'
              - 'internal/webapp/styles/**'
              - 'tools/build-frontend-css.sh'
              - 'tools/verify-frontend-css-sources.py'
              - 'Makefile'
              - '.github/workflows/ci.yml'

      - name: Verify generated frontend stylesheets
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.frontend == 'true'
        run: make check-frontend-css

      # ------------------------------------------------------------------
      # Go
      # ------------------------------------------------------------------

      - name: Set up Go
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true' ||
          steps.changes.outputs.generated == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templ views
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true'
        run: |
          make templ-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          PATH="$(go env GOPATH)/bin:$PATH" make templ

      - name: Go build
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true'
        run: go build ./...

      - name: Go test
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true'
        run: go test ./...

      # ------------------------------------------------------------------
      # Python
      # ------------------------------------------------------------------

      - name: Set up uv
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true' ||
          steps.changes.outputs.generated == 'true'
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
          cache-dependency-glob: nlp/requirements-dev.txt

      - name: Set up Python 3.11
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true' ||
          steps.changes.outputs.generated == 'true'
        run: uv python install 3.11

      - name: Create Python environment
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true' ||
          steps.changes.outputs.generated == 'true'
        run: uv venv --python 3.11 .venv

      - name: Install Python dev dependencies
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        run: |
          uv pip install --python .venv/bin/python \
            --disable-pip-version-check \
            -r nlp/requirements-dev.txt

      # Install CPU-only Torch explicitly before installing Mouseion.
      # This prevents Stanza from pulling in the much larger CUDA-enabled
      # Linux dependency stack on CI runners.
      - name: Install CPU-only PyTorch
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        run: |
          uv pip install --python .venv/bin/python \
            --disable-pip-version-check \
            torch \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install Mouseion NLP
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        run: |
          uv pip install --python .venv/bin/python \
            --disable-pip-version-check \
            -e nlp

      - name: Python build
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        run: >
          PYTHONPATH=nlp/src:gen/python
          .venv/bin/python -m compileall -q nlp/src gen/python

      - name: Python test
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        run: >
          PYTHONPATH=nlp/src:gen/python
          .venv/bin/pytest -q nlp/tests

      - name: Python lint
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.python == 'true'
        run: .venv/bin/ruff check nlp/src nlp/tests

      # ------------------------------------------------------------------
      # Generated protobuf code
      # ------------------------------------------------------------------

      - name: Set up protoc
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.generated == 'true'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0; latest release uses Node 20, no Node 24 release available
        with:
          version: '29.3'

      - name: Install protoc-gen-go
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.generated == 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf code
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.generated == 'true'
        run: make gen

      - name: Set up sqlc
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.generated == 'true'
        uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5.0.0
        with:
          sqlc-version: '1.31.1'

      - name: Generate sqlc code
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.generated == 'true'
        run: make sqlc

      - name: Verify generated code is current
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.generated == 'true'
        run: git diff --exit-code

  golangci:
    name: Go lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templ views
        run: |
          make templ-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          PATH="$(go env GOPATH)/bin:$PATH" make templ

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed files
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3; latest release uses Node 20, no Node 24 release available
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/*.templ'
              - 'go.mod'
              - 'go.sum'
              - 'proto/**'
              - 'gen/go/**'
              - 'gen/sqlc/**'
              - 'sqlc/**'
              - 'migrations/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'

      - name: Set up Go
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Generate templ views
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true'
        run: |
          make templ-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          PATH="$(go env GOPATH)/bin:$PATH" make templ

      # Every package with integration tests runs; each test gets its own
      # database cloned from a migrated template, so packages run in parallel.
      - name: Go integration test
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.go == 'true'
        run: make test-integration

  browser-smoke-shard:
    name: Browser smoke shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed files
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3; latest release uses Node 20, no Node 24 release available
        with:
          # Everything the fixture server binary is built or embeds from, plus
          # the suite itself; docs- and NLP-only changes skip the browsers.
          filters: |
            browser:
              - '**/*.go'
              - '**/*.templ'
              - 'internal/**'
              - 'cmd/**'
              - 'e2e/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

      - name: Set up Go
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.browser == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Node
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.browser == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright dependency
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.browser == 'true'
        working-directory: e2e
        run: npm ci --ignore-scripts
      - name: Install Chromium and WebKit
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.browser == 'true'
        run: npx --prefix e2e playwright install --with-deps chromium webkit
      - name: Generate templ views
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.browser == 'true'
        run: |
          make templ-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          PATH="$(go env GOPATH)/bin:$PATH" make templ

      - name: Build fixture server
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.browser == 'true'
        run: mkdir -p .tmp && go build -o .tmp/fixtureserver ./cmd/fixtureserver
      - name: Run browser smoke
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.browser == 'true'
        working-directory: e2e
        env:
          CI: true
          MOUSEION_FIXTURE_BIN: ../.tmp/fixtureserver
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  # The required status check is named "Browser smoke"; it passes only when
  # every shard succeeded.
  browser-smoke:
    name: Browser smoke
    needs: browser-smoke-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.browser-smoke-shard.result }}
        run: |
          echo "Browser smoke shards: $SHARDS_RESULT"
          test "$SHARDS_RESULT" = success
