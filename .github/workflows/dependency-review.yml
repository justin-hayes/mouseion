name: Dependency review

# Flags pull requests that introduce a dependency with a known high-severity
# (or higher) vulnerability or a license outside `allow-licenses`. Runs on fork
# pull requests too: the job needs no secrets and only reads repository
# contents. A fork's read-only token costs the summary comment, which the
# action warns about rather than fails on. Not gated by the CI change
# classifier in ci.yml.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Write only so the action can post the summary comment on the pull
      # request. Vulnerability and license checks need reads alone.
      pull-requests: write

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The SPDX licenses compatible with this project's AGPL-3.0-only
          # license that the current Go, Python and npm dependency graphs use.
          # Derived from the repository's dependency graph (SPDX SBOM) when this
          # list was added; see doc/development.md, "License check", before
          # changing it. A new dependency's license has to be reviewed and
          # added here before that dependency can land.
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            Apache-2.0 WITH LLVM-exception,
            BSD-2-Clause,
            BSD-3-Clause,
            BSL-1.0,
            CC0-1.0,
            ISC,
            MIT,
            MPL-2.0,
            Zlib
          # Post the findings on the pull request, not just in the job log.
          comment-summary-in-pr: always
