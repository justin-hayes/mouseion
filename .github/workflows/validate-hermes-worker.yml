name: Validate hermes-worker image

# Build-only validation of the hermes-worker Dockerfile on PRs, so a broken
# image is caught BEFORE merge rather than only on push to main. It builds the
# image and runs the smoke test; it never pushes to a registry.
#
# To add: save this as a second job in .github/workflows/publish-hermes-worker.yml
# OR as its own file. The cleanest is to add a `pull_request` trigger + a
# separate `validate` job to the existing publish workflow, since they share the
# build logic. Example job below is drop-in.

on:
  pull_request:
    paths:
      - 'docker/hermes-worker/**'
      - 'Makefile'
      - '.github/workflows/publish-hermes-worker.yml'

concurrency:
  group: validate-hermes-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: docker/hermes-worker
          file: docker/hermes-worker/Dockerfile
          platforms: linux/amd64
          load: true              # load locally so the smoke test can run
          tags: mouseion-hermes-worker:pr
          labels: |
            org.opencontainers.image.title=mouseion-hermes-worker

      - name: Smoke test
        run: make hermes-worker-smoke HERMES_WORKER_IMAGE=mouseion-hermes-worker:pr
