name: Publish hermes-worker image

on:
  push:
    branches: [main]
    paths:
      - 'docker/hermes-worker/**'
      - 'Makefile'
  pull_request:
    paths:
      - 'docker/hermes-worker/**'
      - 'Makefile'
      - '.github/workflows/publish-hermes-worker.yml'
  workflow_dispatch:

concurrency:
  group: publish-hermes-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write          # required for GHCR push

env:
  IMAGE_NAME: ghcr.io/justin-hayes/mouseion/hermes-worker

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: docker/hermes-worker
          file: docker/hermes-worker/Dockerfile
          platforms: linux/amd64
          load: true              # load locally so the smoke test can run
          tags: mouseion-hermes-worker:pr
          labels: |
            org.opencontainers.image.title=mouseion-hermes-worker

      - name: Smoke test
        run: make hermes-worker-smoke HERMES_WORKER_IMAGE=mouseion-hermes-worker:pr

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/hermes-worker
          file: docker/hermes-worker/Dockerfile
          platforms: linux/amd64    # add linux/arm64 + QEMU if you want multi-arch
          push: true
          load: true                # also load locally so the smoke test can run
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test
        run: make hermes-worker-smoke HERMES_WORKER_IMAGE=${{ env.IMAGE_NAME }}:latest
