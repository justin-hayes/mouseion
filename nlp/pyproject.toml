[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mouseion-nlp"
version = "0.0.0"
description = "Mouseion ingest-time NLP producer"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "grpcio==1.84.0",
    "huggingface-hub==1.33.0",
    "protobuf==5.29.6",
    "stanza==1.15.0",
    "transformers==5.19.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
