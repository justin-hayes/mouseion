[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mouseion-nlp"
version = "0.0.0"
description = "Mouseion ingest-time NLP producer"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "grpcio==1.71.2",
    "huggingface-hub==2.1.1",
    "protobuf==5.29.6",
    "stanza==1.15.0",
    "transformers==5.19.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# make coverage runs from the repository root. Relative filenames, and no
# source root to strip, keep the Cobertura report paths resolvable from there.
relative_files = true
include = ["nlp/src/*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus bug, style and modernisation rules.
select = [
    "E4", "E7", "E9", "F",
    "ARG",  # unused arguments
    "B",    # flake8-bugbear
    "BLE",  # blind except
    "C4",   # comprehensions
    "I",    # import sorting
    "N",    # pep8-naming
    "PIE",
    "PT",   # pytest style
    "RUF",
    "SIM",  # simplify
    "UP",   # pyupgrade
]
# Greek text, IPA and typographic quotes are deliberate in this service.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Test fakes match production signatures without using every argument.
"tests/**" = ["ARG"]
