[project]
name = "mouseion-nlp"
version = "0.0.0"
description = "Mouseion ingest-time NLP producer"
license = "AGPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "grpcio==1.71.2",
    "huggingface-hub==2.2.0",
    "protobuf==5.29.6",
    "stanza==1.15.0",
    # CPU-only wheels from the explicit index below; never the CUDA stack from PyPI.
    "torch==2.14.1",
    "transformers==5.19.0",
]

[dependency-groups]
dev = [
    "diff-cover==10.6.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "grpcio-tools==1.71.2",
    "mypy==2.4.0",
    "ruff==0.16.10",
    "setuptools==84.0.0",
]

[tool.uv]
# The service runs from PYTHONPATH (nlp/src, gen/python); it is never installed
# or built as a package. Keeping it unbuilt leaves no unlocked build backend.
package = false

# Explicit: uv consults this index for torch only, so PyPI still serves every
# other package (the PyTorch index hosts older copies of urllib3 and requests).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# make coverage runs from the repository root. Relative filenames, and no
# source root to strip, keep the Cobertura report paths resolvable from there.
# The developer scripts are measured too: the derive/measure tests import them,
# and SonarQube Cloud needs their coverage to judge new lines in the scripts.
relative_files = true
include = ["nlp/src/*", "nlp/scripts/*"]
# Branch coverage as well as line coverage, so the Cobertura report carries the
# condition attributes (branch="true", condition-coverage) on lines with
# branches that SonarQube Cloud reads for Python condition coverage.
branch = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus bug, style and modernisation rules.
select = [
    "E4", "E7", "E9", "F",
    "ARG",  # unused arguments
    "B",    # flake8-bugbear
    "BLE",  # blind except
    "C4",   # comprehensions
    "C90",  # mccabe complexity
    "I",    # import sorting
    "N",    # pep8-naming
    "PIE",
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
    "PT",   # pytest style
    "RUF",
    "S",    # flake8-bandit security
    "SIM",  # simplify
    "UP",   # pyupgrade
]
# Greek text, IPA and typographic quotes are deliberate in this service.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
# Cyclomatic complexity ceiling, the analogue of gocognit on the Go side. Keep
# ruff's default 10 so every function stays small enough to read at a glance;
# derive() was split into helpers to clear it rather than raising the limit.
max-complexity = 10

[tool.ruff.lint.pylint]
# Explicit ceilings for the complexity rules (PLR0911/0912/0913/0915), recorded
# here so a change is deliberate. These are ruff's defaults: five arguments, six
# returns, twelve branches and fifty statements keep a function readable. A
# function that genuinely needs more carries a justified noqa instead of a
# raised limit.
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Test fakes match production signatures without using every argument, and
# pytest's bare asserts are the test idiom (S101 would flag every one).
"tests/**" = ["ARG", "S101"]

[tool.mypy]
python_version = "3.13"
# The service runs from PYTHONPATH (nlp/src, gen/python) and is never installed.
# Put the committed generated protobuf package on the type search path so
# `from mouseion.v1 import ...` resolves to its .pyi stubs; the path is relative
# to the repository root, where `make lint` runs mypy.
mypy_path = "gen/python"

# The runtime dependencies below ship no py.typed marker. Stanza has no stub
# package; for grpc and google.protobuf we use these per-module overrides rather
# than the types-* stub packages, whose versions track the runtime majors. This
# is not a global ignore_missing_imports: the generated protobuf .pyi stubs
# still type the request and response messages.
[[tool.mypy.overrides]]
module = [
    "grpc",
    "grpc.*",  # gen/python's *_pb2_grpc.py imports grpc._utilities
    "google.protobuf",
    "google.protobuf.*",  # the generated .pyi stubs import these
    "stanza",
    "stanza.*",
]
ignore_missing_imports = true
